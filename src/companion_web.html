<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#09090B" id="meta-theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TernaryCode Companion</title>
<style>
/* Exact Slate design tokens matching TernaryCode Mobile (lib/theme/slate_tokens.dart) */
:root, html[data-theme="dark"]{
  color-scheme:dark;
  --window:#09090B;--sheet:#111113;--raised:#1A1A1D;--overlay:#18181B;--menu:#202024;--inset:#0C0C0E;
  --scrim:rgba(0,0,0,.62);
  --hover:rgba(255,255,255,.05);--active:rgba(255,255,255,.08);--selected:rgba(255,255,255,.07);
  --line-subtle:rgba(255,255,255,.06);--line:rgba(255,255,255,.10);--line-strong:rgba(255,255,255,.18);
  --text:#EDEDF0;--text-2:#A0A0A9;--text-3:#6C6C75;--text-4:#4A4A52;
  --accent:#2E6BE6;--accent-hover:#3A76F0;--accent-text:#8BB2FF;--accent-tint:rgba(46,107,230,.14);--on-accent:#FFFFFF;
  --focus-glow:rgba(46,107,230,.28);
  --running:#6AA5FF;--input:#F2B14B;--done:#4DC48C;--failed:#F06A64;--idle:#6C6C75;--limited:#F29441;--cooldown:#5DB6DC;
  --running-tint:rgba(106,165,255,.14);--input-tint:rgba(242,177,75,.15);--done-tint:rgba(77,196,140,.14);
  --failed-tint:rgba(240,106,100,.15);--limited-tint:rgba(242,148,65,.15);--cooldown-tint:rgba(93,182,220,.14);
  --idle-tint:rgba(255,255,255,.06);
  --diff-add:rgba(77,196,140,.13);--diff-del:rgba(240,106,100,.14);
  --term-bg:#0C0C0E;--term-fg:#D6D6DC;--term-dim:#64646E;--term-blue:#7CB2FF;--term-green:#5DD196;
  --term-yellow:#F2C15A;--term-red:#F0716A;--term-mag:#C09CFF;--term-cyan:#68D2E8;--claude:#D97757;
  --h0:#7AAEFF;--h0t:rgba(122,174,255,.14);--h1:#B392FF;--h1t:rgba(179,146,255,.14);
  --h2:#6FD3A0;--h2t:rgba(111,211,160,.14);--h3:#EFC15E;--h3t:rgba(239,193,94,.14);
  --h4:#F58BA6;--h4t:rgba(245,139,166,.14);--h5:#63CFE3;--h5t:rgba(99,207,227,.14);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --term-size:11.5px;
}
html[data-theme="light"]{
  color-scheme:light;
  --window:#EDEDEF;--sheet:#FBFBFC;--raised:#FFFFFF;--overlay:#FFFFFF;--menu:#FFFFFF;--inset:#E9E9EC;
  --scrim:rgba(0,0,0,.34);
  --hover:rgba(0,0,0,.04);--active:rgba(0,0,0,.07);--selected:rgba(0,0,0,.05);
  --line-subtle:rgba(0,0,0,.06);--line:rgba(0,0,0,.10);--line-strong:rgba(0,0,0,.17);
  --text:#17171A;--text-2:#565660;--text-3:#80808A;--text-4:#ABABB3;
  --accent:#1F5FBF;--accent-hover:#1A52A8;--accent-text:#1A56B3;--accent-tint:rgba(31,95,191,.10);--on-accent:#FFFFFF;
  --focus-glow:rgba(31,95,191,.22);
  --running:#2563C9;--input:#B26A00;--done:#15804E;--failed:#C7352D;--idle:#8E8E98;--limited:#C2560A;--cooldown:#2D6C9E;
  --running-tint:rgba(37,99,201,.08);--input-tint:rgba(178,106,0,.09);--done-tint:rgba(21,128,78,.08);
  --failed-tint:rgba(199,53,45,.08);--limited-tint:rgba(194,86,10,.09);--cooldown-tint:rgba(45,108,158,.08);
  --idle-tint:rgba(0,0,0,.05);
  --diff-add:rgba(21,128,78,.08);--diff-del:rgba(199,53,45,.08);
  --term-bg:#FBFBFC;--term-fg:#2A2A30;--term-dim:#8A8A94;--term-blue:#1F5FBF;--term-green:#1C7A4A;
  --term-yellow:#946200;--term-red:#C7352D;--term-mag:#7C3AED;--term-cyan:#0E7490;--claude:#C86445;
  --h0:#2563C9;--h0t:rgba(37,99,201,.10);--h1:#6D28D9;--h1t:rgba(109,40,217,.10);
  --h2:#15804E;--h2t:rgba(21,128,78,.10);--h3:#B26A00;--h3t:rgba(178,106,0,.10);
  --h4:#BE185D;--h4t:rgba(190,24,93,.10);--h5:#0E7490;--h5t:rgba(14,116,144,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--window);color:var(--text);font-family:var(--sans);font-size:13px;line-height:18px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input:focus-visible,textarea:focus-visible{outline:none}
.sprite{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Icons & semantic colors */
.ic{display:block;flex-shrink:0;width:16px;height:16px;fill:currentColor;pointer-events:none}
.ic.s10{width:10px;height:10px}.ic.s11{width:11px;height:11px}.ic.s12{width:12px;height:12px}
.ic.s13{width:13px;height:13px}.ic.s14{width:14px;height:14px}.ic.s18{width:18px;height:18px}
.ic.s20{width:20px;height:20px}.ic.s22{width:22px;height:22px}
.spin{animation:spin 1s linear infinite;animation-delay:var(--spin-delay,0ms)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.c-running{color:var(--running)}.c-input{color:var(--input)}.c-done{color:var(--done)}.c-failed{color:var(--failed)}
.c-idle{color:var(--idle)}.c-limited{color:var(--limited)}.c-cooldown{color:var(--cooldown)}.c-accent{color:var(--accent-text)}
.t-running{background:var(--running-tint);color:var(--running)}.t-input{background:var(--input-tint);color:var(--input)}
.t-done{background:var(--done-tint);color:var(--done)}.t-failed{background:var(--failed-tint);color:var(--failed)}
.t-limited{background:var(--limited-tint);color:var(--limited)}.t-cooldown{background:var(--cooldown-tint);color:var(--cooldown)}
.t-idle{background:var(--idle-tint);color:var(--text-2)}.t-accent{background:var(--accent-tint);color:var(--accent-text)}

/* App shell matching Flutter Mobile Scaffold + BottomNav */
#root{height:100%;width:100%}
.shell{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;background:var(--window);position:relative}
@media (min-width:600px){.shell{border-left:1px solid var(--line-subtle);border-right:1px solid var(--line-subtle)}}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.screen.padded{padding:calc(env(safe-area-inset-top) + 8px) 16px 0}
.scroll-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:24px}

/* Top header (Inbox / Projects / Accounts / Offline Live) */
.top-hdr{display:flex;align-items:center;gap:8px;min-height:40px;flex-shrink:0}
.top-title{margin:0;font-size:22px;line-height:26px;font-weight:600;letter-spacing:-.35px;flex-shrink:0}
.host-pill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:30px;max-width:55%;padding:0 10px;border-radius:15px;background:var(--raised);border:1px solid var(--line-subtle);color:var(--text-2);font-family:var(--mono);font-size:11px;line-height:14px;min-width:0}
.host-pill:active{background:var(--hover)}
.host-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--idle);flex-shrink:0}
.dot.ok{background:var(--done)}.dot.warn{background:var(--input)}.dot.err{background:var(--failed)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;background:var(--raised);border:1px solid var(--line-subtle);color:var(--text-2);flex-shrink:0}
.icon-btn.sm{width:30px;height:28px;border-radius:7px}
.icon-btn.active{background:var(--accent-tint);border-color:rgba(46,107,230,.38);color:var(--accent-text)}
.icon-btn:active{opacity:.8}

/* Unified 1-Row Live Top Bar (matches live_screen.dart) */
.live-top{display:flex;align-items:center;gap:7px;padding:6px 14px 8px;flex-shrink:0}
.live-pill{flex:1;min-width:0;height:40px;padding:0 8px 0 9px;border-radius:10px;background:var(--raised);border:1px solid var(--line-subtle);display:flex;align-items:center;gap:8px}
.live-pill-meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;text-align:left}
.live-proj-name{font-size:13.5px;line-height:15.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-host-row{display:inline-flex;align-items:center;gap:4px;margin-top:1px;font-family:var(--mono);font-size:10px;line-height:12px;color:var(--text-3);min-width:0;max-width:100%}
.live-host-row span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.active-chip{display:inline-flex;align-items:center;gap:2px;padding:3px 7px;border-radius:6px;background:var(--hover);font-family:var(--mono);font-size:10.5px;color:var(--text-2);flex-shrink:0;white-space:nowrap}
.active-chip:active{background:var(--active)}

/* Avatars & Brand Tiles */
.p-av{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;font-family:var(--mono);font-weight:600;flex-shrink:0}
.p-av.s22{width:22px;height:22px;font-size:11px}.p-av.s24{width:24px;height:24px;font-size:11px}
.ag-tile{display:inline-flex;align-items:center;justify-content:center;border-radius:5px;background:var(--hover);border:1px solid var(--line-subtle);flex-shrink:0}
.ag-tile.s20{width:20px;height:20px}.ag-tile.s22{width:22px;height:22px}
.ag-tile svg,.ag-tile img{width:62%;height:62%;display:block;object-fit:contain}

/* Status Pill */
.pill{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 8px 0 6px;border-radius:10px;font-size:11.5px;line-height:14px;font-weight:500;white-space:nowrap;flex-shrink:0}

/* Reconnecting Soft Banner */
.recon-bar{margin:0 14px 7px;padding:6px 10px;border-radius:8px;background:var(--input-tint);border:1px solid rgba(242,177,75,.28);display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--text-2);flex-shrink:0}
.recon-bar .retry-lnk{margin-left:auto;color:var(--input);font-weight:600}

/* Live Sub-Bar (Wrap, Copy, Fullscreen) */
.term-bar{height:38px;padding:0 12px;background:var(--sheet);border-top:1px solid var(--line-subtle);border-bottom:1px solid var(--line-subtle);display:flex;align-items:center;gap:6px;flex-shrink:0}
.term-bar.warn{border-bottom-color:rgba(242,177,75,.34)}
.term-bar.limited{border-bottom-color:rgba(242,148,65,.34)}
.term-meta{flex:1;min-width:0;font-family:var(--mono);font-size:10.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Edge-to-Edge Raw Terminal Canvas (stable DOM, zero scroll-jump) */
.term-stage{flex:1;min-height:0;position:relative;background:var(--term-bg);display:flex;flex-direction:column}
.term-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 0 18px}
.term-scroll.nowrap{overflow-x:auto}
.term-body{font-family:var(--mono);font-size:var(--term-size);line-height:1.52;letter-spacing:-.1px;color:var(--term-fg);font-variant-numeric:tabular-nums}
.t-line{padding:0 12px;min-height:1.52em;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.term-scroll.nowrap .t-line{white-space:pre;overflow-wrap:normal;word-break:normal}
.t-line.bg-add{background:var(--diff-add)}.t-line.bg-del{background:var(--diff-del)}
.t-line.bg-sel{background:var(--accent-tint)}.t-line.bg-prompt{background:rgba(26,26,29,.72);padding-top:2px;padding-bottom:2px}
html[data-theme="light"] .t-line.bg-prompt{background:rgba(0,0,0,.035)}
.t-hr{margin:7px 12px;height:1px;background:var(--line-strong);opacity:.55}
.t-table-wrap{margin:4px 12px;border-radius:7px;background:var(--sheet);border:1px solid var(--line-subtle);overflow-x:auto;-webkit-overflow-scrolling:touch}
.t-table{padding:6px 9px;width:max-content;min-width:100%}
.t-table .t-tline{white-space:pre;line-height:1.45}
.term-working{display:flex;align-items:center;gap:8px;padding:10px 14px 4px;font-family:var(--mono);font-size:11px;color:var(--running)}
.term-working .pdot{width:6px;height:6px;border-radius:50%;background:var(--running);animation:pulse 1.3s ease-in-out infinite}
.latest-pill{position:absolute;right:12px;bottom:10px;height:30px;padding:0 11px;border-radius:15px;background:var(--overlay);border:1px solid var(--line-strong);color:var(--text);font-family:var(--mono);font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:5px;box-shadow:0 4px 14px rgba(0,0,0,.38);z-index:5}
.latest-pill.hidden{display:none}
.latest-pill:active{transform:scale(.97)}

/* Bottom Dock & Composer */
.dock{background:var(--window);border-top:1px solid var(--line-subtle);padding:8px 14px 10px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.notice{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:10px;border:1px solid transparent}
.notice.t-input{border-color:rgba(242,177,75,.28)}.notice.t-limited{border-color:rgba(242,148,65,.30)}.notice.t-failed{border-color:rgba(240,106,100,.28)}
.notice-body{flex:1;min-width:0}
.notice-title{font-size:12px;line-height:16px;font-weight:600;color:var(--text);word-break:break-word}
.notice-text{margin-top:2px;font-family:var(--mono);font-size:11px;line-height:14px;color:var(--text-2);white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.notice-x{color:var(--text-2);padding:3px;border-radius:6px;flex-shrink:0}

/* Interactive TUI Prompt Dock */
.ip-dock{padding:9px 10px;border-radius:10px;background:var(--raised);border:1px solid rgba(242,177,75,.34);display:flex;flex-direction:column;gap:7px}
.ip-head{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text)}
.ip-hint{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.ip-opts{display:flex;flex-direction:column;gap:5px}
.ip-opt{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;border-radius:8px;background:var(--sheet);border:1px solid var(--line-subtle);font-size:12px;color:var(--text)}
.ip-opt.sel{background:var(--accent-tint);border-color:rgba(46,107,230,.45);font-weight:600}
.ip-opt.danger{color:var(--failed)}
.ip-num{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border-radius:4px;background:var(--hover);color:var(--text-2);flex-shrink:0}

/* Quick Keys Strip */
.qkeys{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.qkeys::-webkit-scrollbar{display:none}
.qk{flex-shrink:0;height:30px;padding:0 10px;border-radius:7px;background:var(--raised);border:1px solid var(--line-subtle);font-family:var(--mono);font-size:11px;font-weight:500;color:var(--text-2);display:inline-flex;align-items:center;gap:4px}
.qk.danger{background:var(--failed-tint);border-color:rgba(240,106,100,.28);color:var(--failed)}
.qk:active{opacity:.8}

/* Switch Account Strip */
.swap-strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.swap-strip::-webkit-scrollbar{display:none}
.swap-chip{flex-shrink:0;height:28px;padding:0 9px;border-radius:7px;background:var(--raised);border:1px solid var(--line-subtle);display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--text)}
.swap-chip .pct{color:var(--text-3);font-size:10.5px}

/* Composer Row */
.composer-row{display:flex;align-items:flex-end;gap:7px}
.kb-btn{width:36px;height:38px;border-radius:8px;background:var(--raised);border:1px solid var(--line-subtle);color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.kb-btn.on{background:var(--accent-tint);border-color:rgba(46,107,230,.38);color:var(--accent-text)}
.stop-mini{height:38px;padding:0 9px;border-radius:8px;background:var(--failed-tint);border:1px solid rgba(240,106,100,.28);color:var(--failed);font-family:var(--mono);font-size:11.5px;font-weight:600;flex-shrink:0}
.prompt-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:7px}
.prompt-in{flex:1;min-width:0;height:38px;padding:0 11px;border-radius:9px;background:var(--inset);border:1px solid var(--line);color:var(--text);font-size:13px}
.prompt-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-glow)}
.prompt-in::placeholder{color:var(--text-3)}
@supports (-webkit-touch-callout:none){.prompt-in,.search-in,.pair-in{font-size:16px}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.raised{background:var(--raised);border:1px solid var(--line-subtle);color:var(--text)}
.btn.secondary{background:var(--raised);border:1px solid var(--line);color:var(--text)}
.btn.danger{background:var(--failed-tint);border:1px solid rgba(240,106,100,.25);color:var(--failed)}
.btn.sm{height:32px;padding:0 11px;border-radius:8px;font-size:12px}
.btn.block{width:100%}
.btn:active{opacity:.82}
.btn-row{display:flex;gap:8px}.btn-row>.btn{flex:1;min-width:0}

/* Cards, Sections, Segmented, Tags */
.sec-lbl{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.35px;text-transform:uppercase;color:var(--text-3)}
.card{background:var(--raised);border:1px solid var(--line-subtle);border-radius:12px;overflow:hidden}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:5px;font-family:var(--mono);font-size:10.5px;font-weight:600;background:var(--accent-tint);color:var(--accent-text);flex-shrink:0}
.tag.done{background:var(--done-tint);color:var(--done)}
.tag.muted{background:var(--hover);color:var(--text-3);font-weight:500}
.seg{display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:10px;background:var(--sheet);border:1px solid var(--line-subtle);gap:3px;flex-shrink:0}
.seg button{height:30px;border-radius:7px;font-size:12px;font-weight:500;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:var(--raised);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.22)}
.seg .scnt{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.seg button.on .scnt{color:var(--text-2)}

/* Search Input */
.search-box{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:9px;background:var(--inset);border:1px solid var(--line);flex-shrink:0}
.search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-glow)}
.search-in{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--text);font-size:13px}
.search-in::placeholder{color:var(--text-3)}

/* Projects Tree (matches Desktop & Mobile v0.3.7 1:1) */
.grp-hdr{display:flex;align-items:center;gap:6px;padding:4px 0 8px;width:100%;text-align:left}
.grp-hdr .trail{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.fin-pill{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:10px;background:var(--done-tint);color:var(--done);font-family:var(--mono);font-size:10.5px;font-weight:500}
.fin-pill i{width:5px;height:5px;border-radius:50%;background:var(--done);display:block}
.ptree-blk{padding:9px 10px 8px 12px}
.ptree-blk+.ptree-blk{border-top:1px solid var(--line-subtle)}
.ptree-row{display:flex;align-items:center;gap:9px;min-height:28px}
.folder-ic{position:relative;width:18px;height:18px;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.folder-dot{position:absolute;right:-2px;bottom:-1px;width:6px;height:6px;border-radius:50%;border:1.5px solid var(--raised)}
.ptree-name{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.ptree-name.idle{font-weight:500}
.meta-chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:5px;background:var(--hover);font-family:var(--mono);font-size:10.5px;color:var(--text-3);max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.plus-mini{width:26px;height:26px;border-radius:6px;color:var(--text-3);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.plus-mini:hover,.plus-mini:active{background:var(--hover);color:var(--text)}
.tree-branch{margin-left:9px;padding-left:12px;border-left:1px solid var(--line);margin-top:4px;display:flex;flex-direction:column;gap:3px}
.tree-branch.wt{margin-left:11px}
.wt-row{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:7px;text-align:left;width:100%}
.wt-row:hover,.wt-row:active{background:var(--hover)}
.wt-name{flex:1;min-width:0;font-size:12.5px;font-weight:500;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-leaf{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 8px;border-radius:8px;position:relative;cursor:pointer}
.agent-leaf:hover,.agent-leaf:active{background:var(--hover)}
.agent-leaf.sel{background:var(--selected)}
.agent-leaf.sel::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2.5px;border-radius:2px;background:var(--accent)}
.agent-leaf-info{flex:1;min-width:0}
.agent-leaf-t1{font-size:12.5px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-leaf-t2{font-family:var(--mono);font-size:10.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.close-x{width:24px;height:24px;border-radius:6px;color:var(--text-3);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.close-x:hover,.close-x:active{background:var(--failed-tint);color:var(--failed)}
.idle-row{display:flex;align-items:center;gap:9px;padding:10px 10px 10px 12px;width:100%;text-align:left}
.idle-row:hover,.idle-row:active{background:var(--hover)}
.idle-blk+.idle-blk{border-top:1px solid var(--line-subtle)}

/* Inbox Cards */
.inb-card{background:var(--raised);border:1px solid var(--line-subtle);border-radius:12px;padding:12px 13px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.inb-card.ask{border-color:rgba(242,177,75,.28)}
.inb-top{display:flex;align-items:flex-start;gap:10px}
.inb-head{display:flex;align-items:center;gap:6px;min-width:0}
.inb-proj{font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inb-sub{margin-top:3px;font-size:12px;line-height:16px;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.inb-acts{display:flex;gap:8px;padding-left:34px}
.inb-acts .btn{flex:1;height:32px;font-size:12px}

/* Accounts Summary & Quota Cards */
.stats-strip{display:grid;grid-template-columns:repeat(3,1fr)}
.stat-cell{padding:10px 12px}
.stat-cell+.stat-cell{border-left:1px solid var(--line-subtle)}
.stat-lbl{font-size:11px;color:var(--text-3)}
.stat-val{margin-top:2px;font-family:var(--mono);font-size:15px;font-weight:600;color:var(--text)}
.acct-card{padding:13px;display:flex;flex-direction:column;gap:10px}
.acct-top{display:flex;align-items:flex-start;gap:10px}
.acct-head{display:flex;align-items:center;gap:6px;min-width:0}
.acct-id{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-hint{margin-top:2px;font-size:12px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter{display:flex;flex-direction:column;gap:5px}
.meter-top{display:flex;align-items:baseline;gap:8px;font-family:var(--mono);font-size:11px}
.meter-lbl{color:var(--text-3)}.meter-val{margin-left:auto;color:var(--text-2)}.meter-rst{color:var(--text-3)}
.bar{height:5px;border-radius:3px;background:var(--active);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}
.b-accent{background:var(--accent)}.b-input{background:var(--input)}.b-limited{background:var(--limited)}.b-idle{background:var(--idle)}

/* Bottom Navigation Bar */
.bnav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sheet);border-top:1px solid var(--line-subtle);padding:6px 8px max(10px,env(safe-area-inset-bottom));flex-shrink:0}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--text-3);font-size:11px;line-height:13px;font-weight:500}
.bnav button.on{color:var(--text)}
.nav-ic{position:relative;display:inline-flex}
.nav-badge{position:absolute;top:-5px;right:-10px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;font-family:var(--mono);font-size:10px;line-height:16px;font-weight:600;text-align:center}

/* Bottom Sheets & Modals */
.sheet-backdrop{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-panel{width:100%;max-width:560px;max-height:85vh;background:var(--overlay);border-radius:20px 20px 0 0;border-top:1px solid var(--line-strong);padding:10px 16px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;overflow:hidden}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--line-strong);margin:0 auto}
.sheet-hdr{display:flex;align-items:center;gap:9px}
.sheet-title{font-size:16px;font-weight:600;color:var(--text)}
.sheet-sub{font-family:var(--mono);font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;padding-bottom:4px}
.ag-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ag-opt{display:flex;align-items:center;gap:8px;height:42px;padding:0 10px;border-radius:10px;background:var(--raised);border:1px solid var(--line-subtle);text-align:left;min-width:0}
.ag-opt.on{background:var(--accent-tint);border-color:var(--accent)}
.ag-opt .lbl{flex:1;min-width:0;font-size:12.5px;font-weight:500;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-opt.on .lbl{color:var(--text);font-weight:600}
.ag-opt .cnt{font-family:var(--mono);font-size:10px;font-weight:600;padding:1px 5px;border-radius:5px;background:var(--hover);color:var(--text-3)}
.ag-opt.on .cnt{background:rgba(46,107,230,.18);color:var(--accent-text)}
.hchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.hchips::-webkit-scrollbar{display:none}
.hchip{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:8px;background:var(--raised);border:1px solid var(--line-subtle);font-size:12px;color:var(--text-2)}
.hchip.on{background:var(--accent-tint);border-color:var(--accent);color:var(--text);font-weight:500}
.hchip .det{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.hchip.warn .det{color:var(--limited)}
.sess-row{display:flex;align-items:center;gap:9px;padding:10px 12px;width:100%;text-align:left}
.sess-row+.sess-row{border-top:1px solid var(--line-subtle)}
.sess-row:hover,.sess-row:active{background:var(--hover)}
.sess-t1{font-size:12.5px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-t2{margin-top:2px;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}

/* Settings Rows */
.set-row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.set-row+.set-row{border-top:1px solid var(--line-subtle)}
.set-row .grow{flex:1;min-width:0}
.set-t1{font-weight:500;color:var(--text)}
.set-t2{font-size:12px;color:var(--text-2);margin-top:2px}
.switch{width:40px;height:22px;border-radius:11px;background:var(--active);border:1px solid var(--line);position:relative;flex-shrink:0;transition:background .15s}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch.on::after{transform:translateX(18px)}

/* Fullscreen Terminal Overlay */
.fs-overlay{position:fixed;inset:0;z-index:50;background:var(--window);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

/* Empty, Pair & Toast */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:44px 24px;text-align:center;flex:1}
.empty-tile{width:48px;height:48px;border-radius:12px;background:var(--hover);border:1px solid var(--line-subtle);display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.empty-title{font-size:14px;font-weight:600;color:var(--text)}
.empty-body{max-width:300px;font-size:12px;line-height:17px;color:var(--text-2)}
.solo{height:100vh;height:100dvh;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 64px) 20px 32px;display:flex;justify-content:center}
.solo.center{align-items:center;padding-top:24px}
.pair-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.pair-in{width:100%;height:42px;padding:0 12px;border-radius:9px;background:var(--inset);border:1px solid var(--line);color:var(--text);font-size:13px}
.pair-in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-glow)}
.pair-in.mono{font-family:var(--mono);letter-spacing:.05em}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:8px 14px;border-radius:20px;background:var(--menu);border:1px solid var(--line-strong);color:var(--text);font-size:12px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.45);z-index:80;pointer-events:none;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.confirm-modal{position:fixed;inset:0;background:var(--scrim);z-index:70;display:flex;align-items:center;justify-content:center;padding:24px}
.confirm-card{width:100%;max-width:340px;background:var(--overlay);border:1px solid var(--line-strong);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
</style>

<script>
// ── Base Path & Persistent Preferences (works on LAN `/` and Cloudflare Relay `/r/<hostId>/`) ──
const BASE = location.pathname.replace(/\/(?:index\.html)?$/, "");

        const selIdx = curs.length ? curs[0] : 0;
        let title = "Choose an option";
        for (let k = ord[0].line - 1; k >= Math.max(0, ord[0].line - 6); k--) {
          const lt = lines[k].trim();
          if (lt && !RE_RULE_ANY.test(lt)) { title = lt; break; }
        }
        return {
          kind: "tui",
          title,
          selectedIndex: selIdx,
          allowsEsc: allowsEsc || ord.some((o) => /\(esc\)/i.test(o.label)),
          hint: menuHint,
          options: ord.map((o, i) => ({
            index: i,
            label: o.label,
            isSelected: i === selIdx,
            isDanger: /\b(?:no|deny|reject|cancel|exit|don't trust)\b/i.test(o.label),
          })),
        };
      }
    }
  }

  // Classic [Y/n] prompt.
  const lastLine = lines[scanEnd - 1].trim();
  const ynm = RE_IP_YN.exec(lastLine);
  if (ynm) {
    const defNo = ynm[0].includes("N") && !ynm[0].includes("Y");
    return {
      kind: "yn",
      title: lastLine.slice(0, ynm.index).trim() || "Confirm action",
      selectedIndex: defNo ? 1 : 0,
      allowsEsc,
      hint: menuHint,
      options: [
        { index: 0, label: "Yes", isSelected: !defNo, key: "y", isDanger: false },
        { index: 1, label: "No", isSelected: defNo, key: "n", isDanger: true },
      ],
    };
  }
  return null;
}

// ── Network / API / Real-Time Stream (Cloudflare WS Hibernation + LAN SSE) ──
function closeStreams() {
  if (wsPingTimer) { clearInterval(wsPingTimer); wsPingTimer = null; }
  if (ws) { try { ws.onclose = null; ws.onerror = null; ws.close(); } catch {} ws = null; }
  if (es) { try { es.close(); } catch {} es = null; }
  if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
}
function clearAuth(isRevoked) {
  localStorage.removeItem(TOKEN_KEY);
  if (!IS_RELAY) localStorage.removeItem(LEGACY_TOKEN_KEY);
  token = "";
  state = null;
  connected = false;
  reconnecting = false;
  revoked = Boolean(isRevoked);
  closeStreams();
  render();
}
async function api(subPath, opts = {}) {
  const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
  if (token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(BASE + subPath, Object.assign({}, opts, { headers }));
  if (res.status === 401) {
    clearAuth(true);
    throw new Error("Device token revoked");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = data.error || `HTTP ${res.status}`;
    showToast(err);
    throw new Error(err);
  }
  return data;
}
async function doPair(code, deviceName) {
  if (pairing) return;
  draftCode = code;
  draftName = deviceName;
  pairing = true;
  pairError = "";
  revoked = false;
  render();
  try {
    const res = await fetch(BASE + "/api/pair", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: code.trim(), device_name: deviceName.trim() || "Web Companion" }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.device_token) {
      pairError = data.error || "Invalid or expired pairing code";
      return;
    }
    token = data.device_token;
    localStorage.setItem(TOKEN_KEY, token);
    draftCode = "";
    if (urlPair) {
      try { history.replaceState({}, "", (BASE || "") + "/"); } catch {}
    }
    startLive();
  } catch {
    pairError = "Could not reach TernaryCode — check connection";
  } finally {
    pairing = false;
    render();
  }
}
async function startLive() {
  if (!token) return;
  reconnecting = Boolean(state);
  try {
    state = await api("/api/state");
    connected = true;
    reconnecting = false;
    retryMs = 1000;
    ensureSelection();
    render();
    connectStream();
  } catch (e) {
    if (!token) return;
    connected = false;
    reconnecting = true;
    render();
    scheduleReconnect();
  }
}
function scheduleReconnect() {
  if (retryTimer || !token) return;
  retryTimer = setTimeout(() => {
    retryTimer = null;
    if (token) startLive();
  }, retryMs);
  retryMs = Math.min(retryMs * 2, 8000);
}
function applySnapshot(nextSnap) {
  if (!nextSnap || typeof nextSnap !== "object") return;
  state = nextSnap;
  connected = true;
  reconnecting = false;
  retryMs = 1000;
  ensureSelection();
  updateUI();
}
function connectStream() {
  closeStreams();
  if (!token) return;
  if (IS_RELAY && typeof WebSocket !== "undefined") {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const sock = new WebSocket(`${proto}//${location.host}${BASE}/api/ws?token=${encodeURIComponent(token)}`);
    ws = sock;
    sock.onopen = () => {
      connected = true;
      reconnecting = false;
      retryMs = 1000;
      wsPingTimer = setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          try { ws.send("ping"); } catch {}
        }
      }, 25000);
      patchHeaderDots();
    };
    sock.onmessage = (ev) => {
      if (ev.data === "pong") return;
      try {
        const msg = JSON.parse(ev.data);
        if (msg.t === "state" && msg.d) {
          applySnapshot(typeof msg.d === "string" ? JSON.parse(msg.d) : msg.d);
        } else if (msg.t === "offline") {
          connected = false;
          reconnecting = true;
          patchHeaderDots();
        }
      } catch {}
    };
    sock.onclose = (ev) => {
      if (wsPingTimer) { clearInterval(wsPingTimer); wsPingTimer = null; }
      ws = null;
      if (ev.code === 4401) { clearAuth(true); return; }
      connected = false;
      reconnecting = true;
      patchHeaderDots();
      scheduleReconnect();
    };
    sock.onerror = () => { try { sock.close(); } catch {} };
    return;
  }
  es = new EventSource(`${BASE}/api/events?token=${encodeURIComponent(token)}`);
  es.onopen = () => { connected = true; reconnecting = false; retryMs = 1000; patchHeaderDots(); };
  es.onerror = () => {
    connected = false;
    reconnecting = true;
    patchHeaderDots();
    if (es && es.readyState === EventSource.CLOSED) {
      closeStreams();
      scheduleReconnect();
    }
  };
  es.onmessage = (ev) => {
    try { applySnapshot(JSON.parse(ev.data)); } catch {}
  };
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && token && (!connected || (!ws && !es))) {
    retryMs = 1000;
    startLive();
  }
});

// ── State Helpers & Remote Actions ──
function ensureSelection() {
  const panes = (state && state.panes) || [];
  if (!panes.length) { selectedPaneId = null; return; }
  if (!selectedPaneId || !panes.some((p) => p.id === selectedPaneId)) {
    const urgent = panes.find((p) => p.rate_limit || p.status === "needs_input") || panes[0];
    selectedPaneId = urgent ? urgent.id : null;
  }
}
function currentPane() {
  const panes = (state && state.panes) || [];
  return panes.find((p) => p.id === selectedPaneId) || panes[0] || null;
}
function healthyProfilesFor(pane) {
  return ((state && state.profiles) || [])
    .filter((p) => p.enabled && p.signed_in !== false && p.state !== "rate_limited" && p.state !== "cooldown" && p.state !== "error" && p.id !== pane.profile)
    .sort((a, b) => ((pane.provider && a.provider === pane.provider) ? 0 : 1) - ((pane.provider && b.provider === pane.provider) ? 0 : 1));
}
function projectTargetForPane(pane) {
  const projects = (state && state.projects) || [];
  const rootId = pane.parent_project_id || pane.project_id;
  for (const pr of projects) {
    if (pr.id === rootId) {
      let wt = null;
      if (pane.parent_project_id) {
        wt = (pr.worktrees || []).find((w) => w.id === pane.project_id) || null;
      }
      return { project: pr, worktree: wt };
    }
    const wt = (pr.worktrees || []).find((w) => w.id > 0 && w.id === pane.project_id);
    if (wt) return { project: pr, worktree: wt };
  }
  return projects.length ? { project: projects[0], worktree: null } : null;
}

async function selectPromptOption(paneId, prompt, optIdx) {
  const opt = prompt.options[optIdx];
  if (!opt) return;
  if (prompt.kind === "yn") {
    await sendInput(paneId, opt.key || (optIdx === 0 ? "y" : "n"), true, `Sent ${opt.label}`);
    return;
  }
  const delta = opt.index - prompt.selectedIndex;
  const seq = delta > 0 ? "\x1B[B" : "\x1B[A";
  for (let i = 0; i < Math.abs(delta); i++) {
    await sendInput(paneId, seq, false);
    await new Promise((r) => setTimeout(r, 75));

  await sendInput(paneId, "", true, `Selected ${opt.label}`);

// ── Projects Tree Builder (1:1 port of Mobile projects_screen.dart) ──
function buildProjectTree(query) {
  const q = String(query || "").trim().toLowerCase();
  const projects = (state && state.projects) || [];
  const panes = (state && state.panes) || [];
  const byId = new Map(projects.map((p) => [p.id, p]));
  const byName = new Map(projects.map((p) => [p.name.toLowerCase(), p]));
  const wtById = new Map();
  for (const pr of projects) {
    for (const w of pr.worktrees || []) {
      if (w.id > 0) wtById.set(w.id, { project: pr, wt: w });
    }
  }
  const direct = new Map();
  const wtPanes = new Map();
  const orphans = new Map();

  for (const pane of panes) {
    let parent = null, wt = null;
    if (pane.parent_project_id && byId.has(pane.parent_project_id)) {
      parent = byId.get(pane.parent_project_id);
      wt = (parent.worktrees || []).find((w) => w.id === pane.project_id) || null;
      if (!wt && pane.project_name.includes(" › ")) {
        const suf = pane.project_name.split(" › ").pop().trim();
        wt = (parent.worktrees || []).find((w) => w.name === suf) || null;
      }
    }
    if (!parent && wtById.has(pane.project_id)) {
      const pair = wtById.get(pane.project_id);
      parent = pair.project;
      wt = pair.wt;
    }
    if (!parent) parent = byId.get(pane.project_id) || null;
    if (!parent && pane.project_name.includes(" › ")) {
      const [pn, wn] = pane.project_name.split(" › ");
      const found = byName.get(pn.trim().toLowerCase());
      if (found) {
        parent = found;
        wt = (found.worktrees || []).find((w) => w.name === wn.trim()) || { id: pane.project_id, name: wn.trim(), branch: pane.branch || "", status: effectivePaneStatus(pane), sessions: [] };
      }
    }
    if (parent) {
      if (wt) {
        if (!wtPanes.has(parent.id)) wtPanes.set(parent.id, new Map());
        const m = wtPanes.get(parent.id);
        if (!m.has(wt.name)) m.set(wt.name, []);
        m.get(wt.name).push(pane);
      } else {
        if (!direct.has(parent.id)) direct.set(parent.id, []);
        direct.get(parent.id).push(pane);
      }
    } else {
      if (!orphans.has(pane.project_id)) {
        orphans.set(pane.project_id, { project: { id: pane.project_id, name: pane.project_name, branch: pane.branch, worktrees: [], sessions: [] }, directPanes: [], worktrees: [] });
      }
      orphans.get(pane.project_id).directPanes.push(pane);
    }
  }

  const pMatch = (p) => !q || p.project_name.toLowerCase().includes(q) || p.label.toLowerCase().includes(q) || (p.task || "").toLowerCase().includes(q) || (p.profile || "").toLowerCase().includes(q) || (p.branch || "").toLowerCase().includes(q);
  const wMatch = (w, ps) => !q || w.name.toLowerCase().includes(q) || (w.branch || "").toLowerCase().includes(q) || ps.some(pMatch) || (w.sessions || []).some((s) => s.title.toLowerCase().includes(q));
  const prMatch = (pr) => !q || pr.name.toLowerCase().includes(q) || (pr.branch || "").toLowerCase().includes(q) || (pr.sessions || []).some((s) => s.title.toLowerCase().includes(q)) || (pr.worktrees || []).some((w) => w.name.toLowerCase().includes(q) || (w.branch || "").toLowerCase().includes(q));

  const activeNodes = [], idleProjects = [];
  for (const pr of projects) {
    const rPanes = direct.get(pr.id) || [];
    const wMap = wtPanes.get(pr.id) || new Map();
    const hasLive = rPanes.length > 0 || Array.from(wMap.values()).some((l) => l.length > 0);
    if (hasLive) {
      const sm = prMatch(pr);
      const filtDirect = sm ? rPanes : rPanes.filter(pMatch);
      const seen = new Set(), wNodes = [];
      for (const w of pr.worktrees || []) {
        seen.add(w.name);
        const ps = wMap.get(w.name) || [];
        if (!q || sm || wMatch(w, ps)) wNodes.push({ worktree: w, panes: sm ? ps : ps.filter(pMatch) });
      }
      for (const [wn, ps] of wMap.entries()) {
        if (seen.has(wn)) continue;
        const syn = { id: ps[0].project_id, name: wn, branch: ps[0].branch || "", status: effectivePaneStatus(ps[0]), sessions: [] };
        if (!q || sm || wMatch(syn, ps)) wNodes.push({ worktree: syn, panes: sm ? ps : ps.filter(pMatch) });
      }
      wNodes.sort((a, b) => (b.panes.length ? 1 : 0) - (a.panes.length ? 1 : 0));
      if (sm || filtDirect.length || wNodes.some((w) => w.panes.length)) {
        activeNodes.push({ project: pr, directPanes: filtDirect, worktrees: wNodes });
      }
    } else if (prMatch(pr)) {
      idleProjects.push(pr);
    }
  }
  for (const o of orphans.values()) {
    if (!q || o.project.name.toLowerCase().includes(q) || o.directPanes.some(pMatch)) activeNodes.push(o);
  }
  const rank = (p) => p.rate_limit ? 0 : p.status === "needs_input" ? 1 : p.status === "failed" ? 2 : p.status === "running" ? 3 : p.status === "done" ? 4 : p.status === "active" ? 5 : 6;
  const allOf = (n) => [...n.directPanes, ...n.worktrees.flatMap((w) => w.panes)];
  activeNodes.sort((a, b) => {
    const ar = Math.min(9, ...allOf(a).map(rank));
    const br = Math.min(9, ...allOf(b).map(rank));
    return ar !== br ? ar - br : a.project.name.toLowerCase().localeCompare(b.project.name.toLowerCase());
  });
  let totalLive = 0, finished = 0;
  for (const n of activeNodes) {
    for (const p of allOf(n)) { totalLive++; if (p.status === "done") finished++; }
  }
  return { activeNodes, idleProjects, totalLive, finished };
}

        return `<button class="swap-chip" data-act="switch-prof" data-pane="${pane.id}" data-profile="${esc(pr.id)}">${ic("swap", "s11")}<span>${esc(pr.id)}</span>${pct ? `<span class="pct">${pct}</span>` : ""}</button>`;
      }).join("") + `</div></div>`;
  }

  const quickStrip = !pane.rate_limit && showQuickKeys ? `<div class="qkeys">
    <button class="qk" data-act="qkey" data-pane="${pane.id}" data-key="enter">↵ Enter</button>
    <button class="qk" data-act="qkey" data-pane="${pane.id}" data-key="esc">Esc</button>
    <button class="qk danger" data-act="quick" data-pane="${pane.id}" data-kind="interrupt">^C Stop</button>
    <button class="qk" data-act="qkey" data-pane="${pane.id}" data-key="tab">Tab</button>
    <button class="qk" data-act="qkey" data-pane="${pane.id}" data-key="up">↑</button>
    <button class="qk" data-act="qkey" data-pane="${pane.id}" data-key="down">↓</button>
    <button class="qk" data-act="copy-output" data-pane="${pane.id}">Copy</button>
  </div>` : "";

  const isPrimarySend = pane.status !== "running" && pane.status !== "needs_input" && !pane.rate_limit;
  return `<div class="screen">
    <div class="live-top">
      <div class="live-pill">
        <button data-act="tab" data-tab="projects">${projectAvatar(pane.project_name, 22)}</button>
        <div class="live-pill-meta">
          <button class="live-proj-name" data-act="tab" data-tab="projects" style="text-align:left">${esc(pane.project_name)}</button>
          <button class="live-host-row" data-act="open-settings"><span class="dot ${dotCls}" data-conn-dot></span><span>${esc(hostTitle())}</span>${ic("down", "s10")}</button>
        </div>
        <button class="active-chip" data-act="tab" data-tab="projects">${panes.length} active ${ic("right", "s10")}</button>
      </div>
      ${target ? `<button class="icon-btn" data-act="open-spawn" data-project="${target.project.id}" data-worktree="${target.worktree ? target.worktree.id : ""}" aria-label="New agent">${ic("plus", "s18")}</button>` : ""}
      <button class="icon-btn" data-act="open-settings" aria-label="Settings">${ic("gear", "s18")}</button>
    </div>
    ${reconnecting ? `<div class="recon-bar">${statusGlyph("running", "s11", true)}<span>Reconnecting to ${esc(hostTitle())}…</span><button class="retry-lnk" data-act="retry">Retry</button></div>` : ""}
    <div class="term-bar ${barCls}">
      ${agentTile(paneAgentKey(pane), 20)}
      ${statusPill(effSt, effLbl)}
      <span class="term-meta">${esc(metaParts.join(" · "))}</span>
      <button class="icon-btn sm${prefs.wrap ? " active" : ""}" data-act="toggle-wrap" title="Toggle line wrap">${ic("wrap", "s14")}</button>
      <button class="icon-btn sm" data-act="copy-output" data-pane="${pane.id}" title="Copy output">${ic("copy", "s14")}</button>
      <button class="icon-btn sm" data-act="open-fs" title="Fullscreen">${ic("expand", "s14")}</button>
    </div>
    <div class="term-stage">
      <div class="term-scroll${prefs.wrap ? "" : " nowrap"}" id="term-scroll">
        <div class="term-body" id="term-body"></div>
        <div class="term-working" id="term-working" style="display:${pane.status === "running" && !pane.rate_limit ? "flex" : "none"}"><span class="pdot"></span><span id="term-working-txt">${esc(pane.message || (pane.label + " is working…"))}</span></div>
      </div>
      <button class="latest-pill${termScrolledUp ? "" : " hidden"}" id="latest-pill" data-act="scroll-latest">↓ Latest</button>
    </div>
    <div class="dock">
      ${actionBlock}
      ${switchStrip}
      ${quickStrip}
      <div class="composer-row">
        ${!pane.rate_limit ? `<button class="kb-btn${showQuickKeys ? " on" : ""}" data-act="toggle-keys" title="Terminal keys">${ic("kb", "s16")}</button>` : ""}
        ${pane.status === "running" && !pane.rate_limit && !showQuickKeys ? `<button class="stop-mini" data-act="quick" data-pane="${pane.id}" data-kind="interrupt">^C</button>` : ""}
        <div class="prompt-wrap">
          <input class="prompt-in" id="prompt-input" data-pane="${pane.id}" placeholder="${esc(pane.status === "running" ? "Queue instruction…" : `Reply to ${pane.label}…`)}" autocomplete="off" enterkeyhint="send">
          <button class="btn ${isPrimarySend ? "primary" : "secondary"}" data-act="send-prompt" data-pane="${pane.id}" style="padding:0 15px">Send</button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderInboxScreen() {
  const panes = (state && state.panes) || [];
  const alerts = (state && state.alerts) || [];
  const urgent = panes.filter(isUrgentPane);
  const donePanes = panes.filter((p) => p.status === "done");
  const infoAlerts = alerts.filter((a) => a.level === "info");
  const finCount = donePanes.length + infoAlerts.length;
  const total = urgent.length + finCount;

  let body = "";
  if (inboxFilter !== "finished") {
    if (urgent.length) {
      body += `<div class="sec-lbl" style="margin-bottom:8px">Needs you · oldest first</div>`;
      for (const p of urgent) {
        const isAsk = p.status === "needs_input";
        const isLim = Boolean(p.rate_limit);
        const nextPr = healthyProfilesFor(p)[0] || null;
        const sub = isLim ? `${p.rate_limit.from_profile} hit limit · resets in ${fmtReset(p.rate_limit.resets_at_unix) || "soon"}` : (p.message || p.status_label);
        body += `<div class="inb-card${isAsk ? " ask" : ""}" style="margin-bottom:10px" data-act="focus-pane" data-pane="${p.id}">
          <div class="inb-top">
            ${projectAvatar(p.project_name, 24)}
            <div style="flex:1;min-width:0">
              <div class="inb-head">${statusGlyph(effectivePaneStatus(p), "s13", false)}<span class="inb-proj">${esc(p.project_name)}</span><span class="mono" style="font-size:11px;color:var(--text-3)">${esc(p.label)}</span></div>
              <div class="inb-sub">${esc(sub)}</div>
            </div>
          </div>
          ${isAsk ? `<div class="inb-acts"><button class="btn primary" data-act="quick" data-pane="${p.id}" data-kind="approve">Approve</button><button class="btn raised" data-act="quick" data-pane="${p.id}" data-kind="reject">Reject</button></div>` : ""}
          ${isLim ? `<div class="inb-acts">${nextPr ? `<button class="btn primary" data-act="switch-prof" data-pane="${p.id}" data-profile="${esc(nextPr.id)}">Resume ${esc(nextPr.id)}</button>` : ""}<button class="btn raised" data-act="dismiss-limit" data-pane="${p.id}">Dismiss</button></div>` : ""}
        </div>`;
      }
    } else if (inboxFilter === "needs") {
      body += `<div class="empty"><div class="empty-tile">${ic("check", "s22")}</div><div class="empty-title">Nothing waiting for you</div><div class="empty-body">All running agents are progressing without prompts or rate limits.</div></div>`;
    }
  }
  if (inboxFilter !== "needs") {
    if (finCount) {
      body += `<div class="sec-lbl" style="margin:6px 0 8px">Finished</div>`;
      for (const p of donePanes) {
        body += `<div class="inb-card" style="margin-bottom:10px" data-act="focus-pane" data-pane="${p.id}">
          <div class="inb-top">${projectAvatar(p.project_name, 24)}<div style="flex:1;min-width:0"><div class="inb-head">${statusGlyph("done", "s13", false)}<span class="inb-proj">${esc(p.project_name)}</span><span class="mono" style="font-size:11px;color:var(--text-3)">${esc(p.label)}</span></div><div class="inb-sub">${esc(p.message || "Run completed cleanly")}</div></div><span class="mono" style="font-size:11px;color:var(--text-3)">now</span></div>
        </div>`;
      }
      for (const a of infoAlerts.slice().reverse()) {
        const parts = String(a.message || "").split(":");
        const proj = parts.length > 1 ? parts[0].trim() : (a.profile || "workspace");
        const msg = parts.length > 1 ? parts.slice(1).join(":").trim() : a.message;
        body += `<div class="inb-card" style="margin-bottom:10px" data-act="open-alert-proj" data-proj="${esc(proj)}">
          <div class="inb-top">${projectAvatar(proj, 24)}<div style="flex:1;min-width:0"><div class="inb-head">${statusGlyph("done", "s13", false)}<span class="inb-proj">${esc(proj)}</span><span class="mono" style="font-size:11px;color:var(--text-3)">${esc(a.profile || "Agent")}</span></div><div class="inb-sub">${esc(msg)}</div></div><span class="mono" style="font-size:11px;color:var(--text-3)">${esc((a.time || "").slice(0, 5))}</span></div>
        </div>`;
      }
    } else if (inboxFilter === "finished") {
      body += `<div class="empty"><div class="empty-tile">${ic("tray", "s22")}</div><div class="empty-title">No finished runs yet</div><div class="empty-body">Completed agent runs and summaries appear here.</div></div>`;
    }
  }
  if (inboxFilter === "all" && total === 0) {
    body = `<div class="empty"><div class="empty-tile">${ic("tray", "s22")}</div><div class="empty-title">All clear</div><div class="empty-body">When an agent asks for approval, hits a limit, or finishes, it shows up here.</div></div>`;
  }

  return `<div class="screen padded">
    ${topHeaderHtml("Inbox")}
    <div style="height:12px"></div>
    <div class="seg">
      <button class="${inboxFilter === "all" ? "on" : ""}" data-act="inbox-filter" data-val="all">All <span class="scnt">${total}</span></button>
      <button class="${inboxFilter === "needs" ? "on" : ""}" data-act="inbox-filter" data-val="needs">Needs you <span class="scnt">${urgent.length}</span></button>
      <button class="${inboxFilter === "finished" ? "on" : ""}" data-act="inbox-filter" data-val="finished">Finished <span class="scnt">${finCount}</span></button>
    </div>
    <div style="height:12px"></div>
    <div class="scroll-body">${body}</div>
  </div>`;
}

function renderAgentLeaf(pane) {
  const sel = pane.id === selectedPaneId;
  const effSt = effectivePaneStatus(pane);
  const effLbl = effectivePaneLabel(pane);
  const title = pane.task || pane.label;
  const subParts = [];
  if (pane.task) subParts.push(pane.label);
  if (pane.profile) subParts.push(pane.profile);
  if (pane.branch) subParts.push(pane.branch);
  return `<div class="agent-leaf${sel ? " sel" : ""}" data-act="focus-pane" data-pane="${pane.id}">
    ${agentTile(paneAgentKey(pane), 20)}
    <div class="agent-leaf-info">
      <div class="agent-leaf-t1">${esc(title)}</div>
      ${subParts.length ? `<div class="agent-leaf-t2">${esc(subParts.join(" · "))}</div>` : ""}
    </div>
    ${statusPill(effSt, effLbl)}
    <button class="close-x" data-act="close-pane" data-pane="${pane.id}" aria-label="Close pane">${ic("x", "s12")}</button>
  </div>`;
}

function renderProjectsScreen() {
  const tree = buildProjectTree(projectQuery);
  let listHtml = "";
  if (!tree.activeNodes.length && !tree.idleProjects.length) {
    listHtml = `<div class="empty"><div class="empty-tile">${ic("squares", "s22")}</div><div class="empty-title">${projectQuery ? `No matches for “${esc(projectQuery)}”` : "No projects loaded"}</div></div>`;
  } else {
    if (tree.activeNodes.length) {
      listHtml += `<button class="grp-hdr" data-act="toggle-active-grp">${ic(activeCollapsed ? "right" : "down", "s12")}<span class="sec-lbl">Active · ${tree.activeNodes.length}</span>${tree.finished ? `<span class="fin-pill"><i></i>${tree.finished} finished</span>` : ""}<span class="trail">${tree.totalLive} live</span></button>`;
      if (!activeCollapsed) {
        listHtml += `<div class="card" style="margin-bottom:18px">` + tree.activeNodes.map((n) => {
          const pr = n.project;
          const allP = [...n.directPanes, ...n.worktrees.flatMap((w) => w.panes)];
          const dotCol = allP.some((p) => p.rate_limit) ? "var(--limited)" : allP.some((p) => p.status === "needs_input") ? "var(--input)" : allP.some((p) => p.status === "failed") ? "var(--failed)" : allP.some((p) => p.status === "running") ? "var(--running)" : allP.some((p) => p.status === "done") ? "var(--done)" : "var(--text-3)";
          return `<div class="ptree-blk">
            <div class="ptree-row">
              <span class="folder-ic">${ic("folder", "s16")}<span class="folder-dot" style="background:${dotCol}"></span></span>
              <button class="ptree-name" data-act="open-spawn" data-project="${pr.id}">${esc(pr.name)}</button>
              ${(pr.worktrees || []).length ? `<span class="meta-chip">${ic("fork", "s11")}${pr.worktrees.length}</span>` : (pr.branch ? `<span class="meta-chip">${esc(pr.branch)}</span>` : "")}
              <button class="plus-mini" data-act="open-spawn" data-project="${pr.id}" aria-label="New agent">${ic("plus", "s14")}</button>
            </div>
            ${n.directPanes.length ? `<div class="tree-branch">${n.directPanes.map(renderAgentLeaf).join("")}</div>` : ""}
            ${n.worktrees.length ? `<div class="tree-branch">` + n.worktrees.map((wn) => `
              <button class="wt-row" data-act="open-spawn" data-project="${pr.id}" data-worktree="${wn.worktree.id}">
                <span style="color:var(--done)">${ic("fork", "s13")}</span>
                <span class="wt-name">${esc(wn.worktree.name)}</span>
                ${wn.worktree.merged ? `<span class="tag done">merged</span>` : ""}
                <span style="color:var(--text-3)">${ic("plus", "s12")}</span>
              </button>
              ${wn.panes.length ? `<div class="tree-branch wt">${wn.panes.map(renderAgentLeaf).join("")}</div>` : ""}
            `).join("") + `</div>` : ""}
          </div>`;
        }).join("") + `</div>`;
      }
    }
    if (tree.idleProjects.length) {
      listHtml += `<button class="grp-hdr" data-act="toggle-idle-grp">${ic(idleCollapsed ? "right" : "down", "s12")}<span class="sec-lbl">Idle · ${tree.idleProjects.length}</span><span class="trail">Tap to run or resume</span></button>`;
      if (!idleCollapsed) {
        listHtml += `<div class="card">` + tree.idleProjects.map((pr) => `<div class="idle-blk">
          <button class="idle-row" data-act="open-spawn" data-project="${pr.id}">
            <span class="folder-ic" style="color:var(--text-3)">${ic("folder", "s16")}</span>
            <span class="ptree-name idle">${esc(pr.name)}</span>
            ${(pr.worktrees || []).length ? `<span class="meta-chip">${ic("fork", "s11")}${pr.worktrees.length}</span>` : ""}
            ${pr.branch ? `<span class="meta-chip">${esc(pr.branch)}</span>` : ""}
            <span class="plus-mini">${ic("plus", "s14")}</span>
          </button>
          ${(pr.worktrees || []).length ? `<div class="tree-branch" style="margin:0 10px 8px 21px">` + pr.worktrees.map((w) => `
            <button class="wt-row" data-act="open-spawn" data-project="${pr.id}" data-worktree="${w.id}">
              <span style="color:var(--text-3)">${ic("fork", "s13")}</span>
              <span class="wt-name">${esc(w.name)}</span>
              ${w.merged ? `<span class="tag done">merged</span>` : ""}
            </button>
          `).join("") + `</div>` : ""}
        </div>`).join("") + `</div>`;
      }
    }
  }

  return `<div class="screen padded">
    ${topHeaderHtml("Projects")}
    <div style="height:12px"></div>
    <div class="search-box">
      <span style="color:var(--text-3)">${ic("search", "s14")}</span>
      <input class="search-in" id="proj-search" value="${esc(projectQuery)}" placeholder="Filter projects, worktrees & agents…" autocomplete="off">
      ${projectQuery ? `<button data-act="clear-search" style="color:var(--text-3)" aria-label="Clear">${ic("x", "s14")}</button>` : ""}
    </div>
    <div style="height:14px"></div>
    <div class="scroll-body">${listHtml}</div>
  </div>`;
}

function renderQuotaMeter(w) {
  if (!w) return "";
  const pct = w.used_pct != null ? Math.round(w.used_pct) : null;
  const tone = pct == null ? "idle" : pct >= 90 ? "limited" : pct >= 70 ? "input" : "accent";
  const val = pct != null ? `${pct}%${w.tokens ? ` · ${fmtTokens(w.tokens)}` : ""}` : `${fmtTokens(w.tokens || 0)} tok`;
  const rst = fmtReset(w.resets_at_unix);
  return `<div class="meter">
    <div class="meter-top">
      <span class="meter-lbl">${esc(w.label)}</span>
      <span class="meter-val${pct != null && pct >= 70 ? ` c-${tone}` : ""}">${esc(val)}</span>
      ${rst ? `<span class="meter-rst">↺ ${esc(rst)}</span>` : ""}
    </div>
    <div class="bar"><i class="b-${tone}" style="width:${pct != null ? Math.min(100, Math.max(0, pct)) : 0}%"></i></div>
  </div>`;
}

function renderAccountsScreen() {
  const panes = (state && state.panes) || [];
  const profiles = (state && state.profiles) || [];
  const runningCount = panes.filter((p) => p.status === "running").length;
  const healthyCount = profiles.filter((p) => p.enabled && p.state !== "rate_limited" && p.state !== "cooldown" && p.state !== "error").length;
  const tok5h = profiles.reduce((s, p) => s + ((p.window_5h && p.window_5h.tokens) || 0), 0);
  const isAuto = (state && state.failover_mode) === "auto";

  const cards = profiles.length ? profiles.map((p, idx) => {
    const acc = ACCOUNT_MAP[p.enabled ? p.state : "disabled"] || ["idle", String(p.state || "").replace("_", " ")];
    const hint = p.account_hint ? `${p.provider} · ${p.account_hint}` : p.provider;
    return `<div class="card acct-card" style="margin-bottom:10px${p.enabled ? "" : ";opacity:.55"}">
      <div class="acct-top">
        ${agentTile(p.provider, 22)}
        <div style="flex:1;min-width:0">
          <div class="acct-head">
            <span class="mono" style="font-size:11px;color:var(--text-3)">#${idx + 1}</span>
            <span class="acct-id">${esc(p.id)}</span>
            ${p.plan_type ? `<span class="tag">${esc(p.plan_type.toUpperCase())}</span>` : ""}
          </div>
          <div class="acct-hint">${esc(hint)}${p.signed_in === false ? ` · <span class="c-input">Not signed in</span>` : ""}</div>
        </div>
        ${statusPill(acc[0], acc[1])}
      </div>
      ${renderQuotaMeter(p.window_5h)}
      ${renderQuotaMeter(p.window_weekly)}
      ${!p.window_5h && !p.window_weekly ? `<div class="mono" style="font-size:11px;color:var(--text-3)">Usage: ${fmtTokens((p.tokens_in || 0) + (p.tokens_out || 0))} tokens</div>` : ""}
    </div>`;
  }).join("") : `<div class="card" style="padding:16px;color:var(--text-2)">No AI agent accounts configured on this host yet.</div>`;

  return `<div class="screen padded">
    ${topHeaderHtml("Accounts")}
    <div style="height:12px"></div>
    <div class="scroll-body">
      <div class="card stats-strip" style="margin-bottom:12px">
        <div class="stat-cell"><div class="stat-lbl">Running</div><div class="stat-val">${runningCount}</div></div>
        <div class="stat-cell"><div class="stat-lbl">Healthy</div><div class="stat-val" style="color:var(--done)">${healthyCount}/${profiles.length}</div></div>
        <div class="stat-cell"><div class="stat-lbl">5h tokens</div><div class="stat-val">${fmtTokens(tok5h)}</div></div>
      </div>
      <div class="card" style="margin-bottom:14px">
        <div class="set-row">
          <div class="grow"><div class="set-t1">Failover mode</div><div class="set-t2">When an account hits its usage limit</div></div>
          <span class="tag">${isAuto ? "Automatic" : "Ask me"}</span>
        </div>
      </div>
      <div class="sec-lbl" style="margin-bottom:8px">Failover order</div>
      ${cards}
    </div>
  </div>`;
}

// ── Bottom Sheets & Overlays ──
const AGENT_OPTS = [
  { slug: "claude", label: "Claude Code", prof: true },
  { slug: "codex", label: "Codex", prof: true },
  { slug: "antigravity", label: "Antigravity", prof: true },
  { slug: "opencode", label: "OpenCode", prof: false },
  { slug: "gemini", label: "Gemini CLI", prof: false },
  { slug: "shell", label: "Terminal", prof: false },
];

function renderSpawnSheetHtml() {
  if (!spawnSheet || !state) return "";
  const project = (state.projects || []).find((p) => p.id === spawnSheet.projectId);
  if (!project) return "";
  const wt = spawnSheet.worktreeId ? (project.worktrees || []).find((w) => w.id === spawnSheet.worktreeId) || null : null;
  const activeOpt = AGENT_OPTS.find((a) => a.slug === spawnSheet.agent) || AGENT_OPTS[0];
  const allSess = wt ? (wt.sessions || []) : (project.sessions || []);
  const agentSess = spawnSheet.agent === "shell" ? [] : allSess.filter((s) => normalizeAgent(s.agent) === spawnSheet.agent);
  const profiles = activeOpt.prof ? (state.profiles || []).filter((p) => p.enabled && normalizeAgent(p.provider) === spawnSheet.agent) : [];
  const sub = wt ? `${project.name} › ${wt.name}${wt.branch ? ` · ${wt.branch}` : ""}` : (project.branch ? `${project.name} · ${project.branch}` : project.name);
  const targetId = wt ? wt.id : project.id;

  return `<div class="sheet-backdrop" data-act="close-spawn-bg">
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-hdr">
        ${projectAvatar(project.name, 22)}
        <div style="flex:1;min-width:0">
          <div class="sheet-title">New agent</div>
          <div class="sheet-sub">${esc(sub)}</div>
        </div>
        <button class="icon-btn sm" data-act="close-spawn">${ic("x", "s14")}</button>
      </div>
      <div class="sheet-scroll">
        ${(project.worktrees || []).length ? `<div>
          <div class="sec-lbl" style="margin-bottom:7px">Workspace</div>
          <div class="hchips">
            <button class="hchip${!wt ? " on" : ""}" data-act="spawn-wt" data-wt="">${ic("folder", "s12")}<span>${esc(project.branch || project.name)}</span></button>
            ${project.worktrees.map((w) => `<button class="hchip${wt && wt.id === w.id ? " on" : ""}" data-act="spawn-wt" data-wt="${w.id}">${ic("fork", "s12")}<span>${esc(w.name)}</span>${w.merged ? `<span class="tag done">merged</span>` : ""}</button>`).join("")}
          </div>
        </div>` : ""}
        <div>
          <div class="sec-lbl" style="margin-bottom:8px">Agent</div>
          <div class="ag-grid">
            ${AGENT_OPTS.map((opt) => {
              const on = spawnSheet.agent === opt.slug;
              const cnt = opt.slug === "shell" ? 0 : allSess.filter((s) => normalizeAgent(s.agent) === opt.slug).length;
              return `<button class="ag-opt${on ? " on" : ""}" data-act="spawn-agent" data-slug="${opt.slug}">${agentTile(opt.slug, 22)}<span class="lbl">${esc(opt.label)}</span>${cnt ? `<span class="cnt">${cnt}</span>` : ""}</button>`;
            }).join("")}
          </div>
        </div>
        ${profiles.length ? `<div>
          <div class="sec-lbl" style="margin-bottom:8px">Account</div>
          <div class="hchips">
            <button class="hchip${!spawnSheet.profileId ? " on" : ""}" data-act="spawn-prof" data-prof=""><span>Auto</span><span class="det">best healthy</span></button>
            ${profiles.map((pr) => {
              const det = pr.state === "rate_limited" ? "limited" : (pr.window_5h && pr.window_5h.used_pct != null ? `${Math.round(pr.window_5h.used_pct)}%` : pr.state);
              return `<button class="hchip${spawnSheet.profileId === pr.id ? " on" : ""}${pr.state === "rate_limited" ? " warn" : ""}" data-act="spawn-prof" data-prof="${esc(pr.id)}"><span>${esc(pr.id)}</span><span class="det">${esc(det)}</span></button>`;
            }).join("")}
          </div>
        </div>` : ""}
        <button class="btn primary block" data-act="spawn-start">${ic("plus", "s14")}${spawnSheet.agent === "shell" ? "New Terminal" : `New ${esc(activeOpt.label)} session`}</button>
        ${spawnSheet.agent !== "shell" ? `<div>
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <span class="sec-lbl">Resume session${agentSess.length ? ` · ${agentSess.length}` : ""}</span>
            ${agentSess.length ? `<span class="mono" style="font-size:10.5px;color:var(--text-3)">Tap to continue</span>` : ""}
          </div>
          ${agentSess.length ? `<div class="card">` + agentSess.map((s) => `
            <button class="sess-row" data-act="spawn-resume" data-project="${targetId}" data-agent="${esc(s.agent)}" data-session="${esc(s.id)}" data-live="${s.live_pane || ""}">
              ${statusGlyph(s.status, "s13", false)}
              <div style="flex:1;min-width:0">
                <div class="sess-t1">${esc(s.title)}</div>
                <div class="sess-t2">${esc(s.profile || s.agent)} · ${esc(s.age)}</div>
              </div>
              ${s.live_pane ? `<span class="tag">Live</span>` : `<span class="mono" style="font-size:11px;color:var(--accent-text)">Resume</span>`}
            </button>
          `).join("") + `</div>` : `<div class="card" style="padding:12px;color:var(--text-3);font-size:12px">No previous ${esc(activeOpt.label)} sessions found in this workspace.</div>`}
        </div>` : ""}
      </div>
    </div>
  </div>`;
}

    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div class="sheet-hdr">

      <span style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(pane.project_name)}</span>
      ${statusPill(effectivePaneStatus(pane), effectivePaneLabel(pane))}
      <span style="flex:1"></span>

      <button class="icon-btn sm" data-act="copy-output" data-pane="${pane.id}">${ic("copy", "s14")}</button>
      <button class="icon-btn sm" data-act="close-fs">${ic("x", "s14")}</button>

        <button class="btn primary" data-act="send-fs-prompt" data-pane="${pane.id}">Send</button>
