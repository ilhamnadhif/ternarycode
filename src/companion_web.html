<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#EDEDEF" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TernaryCode Companion</title>
<style>
/* Slate tokens (design/figcraft/tokens.py): dark first, light under prefers-color-scheme. */
:root{
  color-scheme:dark;
  --window:#09090B;--sheet:#111113;--raised:#1A1A1D;--inset:#0C0C0E;
  --hover:rgba(255,255,255,.04);--active:rgba(255,255,255,.08);
  --line-subtle:rgba(255,255,255,.06);--line:rgba(255,255,255,.10);--line-strong:rgba(255,255,255,.17);
  --text:#EDEDF0;--text-2:#A1A1AA;--text-3:#6C6C75;
  --accent:#2E6BE6;--accent-hover:#3A78F0;--accent-text:#8BB2FF;--accent-tint:rgba(46,107,230,.16);--on-accent:#FFFFFF;
  --focus-glow:rgba(79,140,255,.25);
  --running:#6AA5FF;--input:#F2B14B;--done:#4DC48C;--failed:#F06A64;--idle:#6C6C75;--limited:#F29441;--cooldown:#5DB6DC;
  --running-tint:rgba(106,165,255,.12);--input-tint:rgba(242,177,75,.12);--done-tint:rgba(77,196,140,.12);
  --failed-tint:rgba(240,106,100,.12);--limited-tint:rgba(242,148,65,.12);--cooldown-tint:rgba(93,182,220,.12);
  --idle-tint:rgba(255,255,255,.06);
  --term-fg:#D9D9DE;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Roboto,sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root{
    color-scheme:light;
    --window:#EDEDEF;--sheet:#FBFBFC;--raised:#FFFFFF;--inset:#E9E9EC;
    --hover:rgba(0,0,0,.04);--active:rgba(0,0,0,.07);
    --line-subtle:rgba(0,0,0,.06);--line:rgba(0,0,0,.10);--line-strong:rgba(0,0,0,.17);
    --text:#17171A;--text-2:#565660;--text-3:#80808A;
    --accent:#1F5FBF;--accent-hover:#1A52A8;--accent-text:#1A56B3;--accent-tint:rgba(31,95,191,.10);
    --focus-glow:rgba(31,95,191,.22);
    --running:#2563C9;--input:#B26A00;--done:#15804E;--failed:#C7352D;--idle:#8E8E98;--limited:#C2560A;--cooldown:#2D6C9E;
    --running-tint:rgba(37,99,201,.08);--input-tint:rgba(178,106,0,.09);--done-tint:rgba(21,128,78,.08);
    --failed-tint:rgba(199,53,45,.08);--limited-tint:rgba(194,86,10,.08);--cooldown-tint:rgba(45,108,158,.08);
    --idle-tint:rgba(0,0,0,.05);
    --term-fg:#2A2A30;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--window);color:var(--text);font-family:var(--sans);font-size:13px;line-height:18px;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input{font:inherit;color:inherit;margin:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field input:focus-visible{outline:none}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.mono{font-family:var(--mono)}

/* Icons (Phosphor glyphs; fill only for status) and status colours. */
.ic{display:block;flex-shrink:0;width:16px;height:16px;fill:currentColor;pointer-events:none}
.ic.g12{width:12px;height:12px}.ic.g14{width:14px;height:14px}
.spin{animation:spin 1.2s linear infinite;animation-delay:var(--spin-delay,0ms)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.c-running{color:var(--running)}.c-input{color:var(--input)}.c-done{color:var(--done)}.c-failed{color:var(--failed)}
.c-idle{color:var(--idle)}.c-limited{color:var(--limited)}.c-cooldown{color:var(--cooldown)}.c-accent{color:var(--accent-text)}
.t-running{background:var(--running-tint);color:var(--running)}.t-input{background:var(--input-tint);color:var(--input)}
.t-done{background:var(--done-tint);color:var(--done)}.t-failed{background:var(--failed-tint);color:var(--failed)}
.t-limited{background:var(--limited-tint);color:var(--limited)}.t-cooldown{background:var(--cooldown-tint);color:var(--cooldown)}
.t-idle{background:var(--idle-tint);color:var(--text-2)}.t-accent{background:var(--accent-tint);color:var(--accent-text)}

/* App shell: one scrolling screen above a bottom tab bar. */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:720px;margin:0 auto}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px 20px}
main>*{flex-shrink:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{margin:0;font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.4px}
.conn{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;background:var(--hover);font-family:var(--mono);font-size:11px;line-height:14px;color:var(--text-2);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--idle);flex-shrink:0}
.dot.ok{background:var(--done)}.dot.warn{background:var(--input)}
nav{display:grid;grid-template-columns:repeat(4,1fr);flex-shrink:0;background:var(--sheet);padding:8px 8px max(18px,env(safe-area-inset-bottom))}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;border:0;background:none;color:var(--text-3);font-size:11px;line-height:14px}
nav button.active{color:var(--text)}
nav .ic{width:20px;height:20px}
.tab-ic{position:relative;display:block}
.count{position:absolute;top:-6px;left:12px;min-width:16px;height:16px;padding:0 5px;border-radius:8px;font-family:var(--mono);font-size:11px;line-height:16px;font-weight:600;text-align:center}
.count.t-input{background:linear-gradient(var(--input-tint),var(--input-tint)),var(--sheet)}
.count.t-failed{background:linear-gradient(var(--failed-tint),var(--failed-tint)),var(--sheet)}

/* Text roles. */
.grow{flex:1;min-width:0}
.t1{font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t1.wrap{white-space:normal;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.t2{margin-top:2px;font-size:12px;line-height:16px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.data{margin-top:2px;font-family:var(--mono);font-size:11px;line-height:14px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{font-size:12px;line-height:16px;color:var(--text-3)}
.label{font-size:11px;line-height:14px;font-weight:500;letter-spacing:.1px;text-transform:uppercase;color:var(--text-3)}

/* Buttons and fields. */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:0;height:44px;padding:0 14px;border:0;border-radius:10px;font-size:13px;line-height:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.raised{background:var(--raised);color:var(--text)}
.btn.secondary{background:var(--raised);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--failed-tint);color:var(--failed)}
.btn.sm{height:36px;padding:0 14px;border-radius:8px}
.btn.block{width:100%}
.btn:active{opacity:.8}
@media (hover:hover){.btn.primary:hover{background:var(--accent-hover)}.btn.raised:hover,.btn.secondary:hover{background:linear-gradient(var(--hover),var(--hover)),var(--raised)}}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns .btn{flex:1 1 140px}
.field{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:7px;background:var(--inset);border:1px solid var(--line);transition:border-color .12s,box-shadow .12s}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--focus-glow)}
.field.err{border-color:var(--failed)}
.field .ic{width:14px;height:14px;color:var(--text-3)}
.field input{flex:1;min-width:0;height:100%;padding:0;border:0;outline:0;background:transparent;font-size:13px;color:var(--text)}
.field input.mono{font-family:var(--mono);font-size:12px;letter-spacing:.02em}
.field input::placeholder{color:var(--text-3);opacity:1}
/* iOS zooms into inputs under 16px; keep the page still. */
@supports (-webkit-touch-callout:none){.field input,.field input.mono{font-size:16px}}
.composer{display:flex;gap:8px}
.composer .field{flex:1}

/* Live: pane chips, the output sheet, the Notice. */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 10px;border:0;border-radius:15px;background:var(--hover);color:var(--text);font-size:12px;line-height:16px;white-space:nowrap}
.chip.active{background:var(--raised);font-weight:500}
.chip .lbl{color:var(--text-3);font-weight:400}
.sheet{display:flex;flex-direction:column;overflow:hidden;background:var(--sheet);border:1px solid var(--line-subtle);border-radius:12px}
.pane-head{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;flex-shrink:0}
.where{margin-left:auto;min-width:0;font-family:var(--mono);font-size:11px;line-height:14px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* The output sheet takes the height the rest of the screen leaves, never less than ~12 lines. */
main>.sheet{flex:1 0 auto}
.term{flex:1 1 0;min-height:172px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 12px 12px;font-family:var(--mono);font-size:11px;line-height:14px;color:var(--term-fg);white-space:pre-wrap;word-break:break-word}
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px 0 6px;border-radius:10px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap;flex-shrink:0}
.notice{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:9px;border:1px solid transparent}
.notice.t-input{border-color:var(--input-tint)}.notice.t-limited{border-color:var(--limited-tint)}.notice.t-failed{border-color:var(--failed-tint)}
.n-title{font-size:12px;line-height:16px;font-weight:500;color:var(--text);word-break:break-word}
.n-body{margin-top:2px;font-family:var(--mono);font-size:11px;line-height:14px;color:var(--text-2);white-space:pre-wrap;word-break:break-word}
.sect{display:flex;flex-direction:column;gap:8px}
.swaps{display:flex;flex-wrap:wrap;gap:6px}
.swap{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line-subtle);background:var(--raised);font-family:var(--mono);font-size:11px;line-height:14px;color:var(--text)}
.swap .ic{color:var(--text-3)}
.swap .pct{color:var(--text-3)}

/* Cards, rows, Inbox items, meters. */
.card{overflow:hidden;background:var(--raised);border:1px solid var(--line-subtle);border-radius:12px}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px}
.row+.row{border-top:1px solid var(--line-subtle)}
.row.click{cursor:pointer}
.row.click:active{background:var(--hover)}
@media (hover:hover){.row.click:hover,.chip:not(.active):hover{background:var(--hover)}}
.group{display:flex;flex-direction:column;gap:8px}
.group+.group{margin-top:8px}
.group-head{display:flex;align-items:center;gap:10px;min-width:0;padding:0 2px}
.group-head .name{font-size:14px;line-height:20px;font-weight:600;letter-spacing:-.1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.branch{display:inline-flex;align-items:center;gap:4px;min-width:0;font-family:var(--mono);font-size:11px;line-height:14px;color:var(--text-3)}
.branch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-flex;align-items:center;flex-shrink:0;height:18px;padding:0 6px;border-radius:5px;font-family:var(--mono);font-size:11px;line-height:14px;font-weight:600}
.go{display:inline-flex;align-items:center;gap:5px;flex-shrink:0;height:28px;padding:0 10px;border-radius:7px;border:1px solid var(--line);font-size:12px;line-height:16px;font-weight:500;color:var(--text)}
.val{flex-shrink:0;font-size:12px;line-height:16px;font-weight:500;color:var(--text-2)}
.list{display:flex;flex-direction:column;gap:12px}
.item{display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:12px;background:var(--raised)}
.item>.ic{margin-top:2px}
.age{flex-shrink:0;margin-top:2px;font-family:var(--mono);font-size:11px;line-height:14px;color:var(--text-3)}
.acct{display:flex;flex-direction:column;gap:12px;padding:14px}
.acct-top{display:flex;align-items:flex-start;gap:10px}
.acct-line{display:flex;align-items:center;gap:8px;min-width:0}
.acct-id{font-family:var(--mono);font-size:12px;line-height:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct.dim{opacity:.55}
.meter{display:flex;flex-direction:column;gap:6px}
.meter-top{display:flex;align-items:baseline;gap:8px;font-family:var(--mono);font-size:11px;line-height:14px}
.meter-lbl{color:var(--text-3)}
.meter-val{margin-left:auto;color:var(--text-2)}
.meter-rst{color:var(--text-3)}
.bar{height:5px;border-radius:3px;background:var(--active);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}
.b-accent{background:var(--accent)}.b-input{background:var(--input)}.b-limited{background:var(--limited)}.b-idle{background:var(--idle)}

/* Empty states: icon tile, title, one sentence. */
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 24px;text-align:center}
main>.empty{flex:1 0 auto;justify-content:center;padding-bottom:96px}
.empty-tile{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:12px;background:var(--hover);border:1px solid var(--line-subtle);color:var(--text-2)}
.empty-tile .ic{width:22px;height:22px}
.empty-title{font-size:14px;line-height:20px;font-weight:600;letter-spacing:-.1px}
.empty-body{max-width:300px;font-size:12px;line-height:16px;color:var(--text-2)}
.empty .duo{max-width:300px;margin-top:6px}

/* Pair and Connecting: one column, no tab bar. */
.solo{height:100vh;height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 88px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.solo.center{display:flex;align-items:center;justify-content:center;padding-top:calc(env(safe-area-inset-top) + 24px)}
.pair{display:flex;flex-direction:column;gap:12px;max-width:400px;margin:0 auto}
.logo{display:block;width:56px;height:56px}
.lead{margin:0;max-width:330px;color:var(--text-2)}
.note{margin:0;max-width:330px;font-size:12px;line-height:16px;color:var(--text-3)}
.err-text{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--failed)}
</style>
</head>

</defs></svg>
<div id="root"></div>
<script>
const KEY = "tc_companion_token_v1";
let token = localStorage.getItem(KEY) || "";
let state = null;
let tab = "live";
let selectedPane = null;
let lastRenderedPane = null;
let lastRenderedTab = null;
let lastRenderedPaneKey = null;
let es = null;
let retryTimer = null;
let retryMs = 1000;
let connected = false;
let pairError = "";
let pairing = false;
let toastMsg = "";
let toastTimer = null;

const params = new URLSearchParams(location.search);
const urlPair = params.get("pair") || "";
let draftCode = urlPair;
let draftName = /iPhone/.test(navigator.userAgent)?"iPhone":/Android/.test(navigator.userAgent)?"Android Phone":"Mobile Browser";
const root = document.getElementById("root");
function hostName(){ return (state && state.host_os) || "computer"; }

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtTok(n){n=Number(n||0);if(n>=1e6)return(n/1e6).toFixed(1)+"M";if(n>=1e3)return(n/1e3).toFixed(1)+"k";return String(n)}
function fmtSec(s){if(!s||s<=0)return"";const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),r=s%60;return h?`${h}h ${String(m).padStart(2,"0")}m`:m?`${m}m ${String(r).padStart(2,"0")}s`:`${r}s`}

// Status glyphs: [icon, colour token]. Unknown values fall back to idle.
const STATUS = {
  running:["notch","running"], needs_input:["chat","input"], done:["check","done"], failed:["x","failed"],
  idle:["circle","idle"], rate_limited:["hourglass","limited"], cooldown:["clock","cooldown"]
};
// Account states: [status glyph, label].
const ACCOUNT = {
  idle:["done","Ready"], running:["running","In use"], rate_limited:["rate_limited","Limited"],
  cooldown:["cooldown","Cooldown"], error:["failed","Error"], disabled:["idle","Off"]
};
function own(map, key){ return Object.prototype.hasOwnProperty.call(map, key) ? map[key] : null; }
function st(status){ return own(STATUS, status) || STATUS.idle; }
function ic(name, cls){ return `<svg class="ic${cls?" "+cls:""}" aria-hidden="true"><use href="#i-${name}"/></svg>`; }
function glyph(status, size, spin){
  const s = st(status);
  return ic(s[0], `g${size||12} c-${s[1]}${s[0]==="notch" && spin!==false ? " spin" : ""}`);
}
function pill(status, label){
  const s = st(status);
  return `<span class="pill t-${s[1]}">${glyph(status, 12)}${esc(label)}</span>`;
}
function notice(status, titleHtml, body){
  const s = st(status);
  return `<div class="notice t-${s[1]}">${glyph(status, 16, false)}<div class="grow">
    <div class="n-title">${titleHtml}</div>${body?`<div class="n-body">${esc(body)}</div>`:""}</div></div>`;
}
function emptyState(icon, title, body, actions){
  return `<div class="empty"><div class="empty-tile">${ic(icon)}</div><div class="empty-title">${title}</div><div class="empty-body">${body}</div>${actions||""}</div>`;
}
const LOGO = `<svg class="logo" viewBox="0 0 1024 1024" aria-label="TernaryCode" role="img">
  <rect x="72" y="72" width="880" height="880" rx="196" fill="#1f5fbf"/>
  <path d="M 512 312 L 312 512 L 512 712" fill="none" stroke="#fff6ea" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 712 312 L 512 712" fill="none" stroke="#fff6ea" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff6ea"><circle cx="512" cy="312" r="52"/><circle cx="712" cy="312" r="52"/><circle cx="312" cy="512" r="52"/><circle cx="512" cy="712" r="52"/></g>
  <g fill="#fff6ea" fill-opacity="0.32"><circle cx="312" cy="312" r="30"/><circle cx="512" cy="512" r="30"/><circle cx="712" cy="512" r="30"/><circle cx="312" cy="712" r="30"/><circle cx="712" cy="712" r="30"/></g>
</svg>`;

function showError(msg){
  toastMsg = msg || "Request failed";
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toastMsg = ""; render(); }, 4000);
  render();
}

function clearAuth(){
  localStorage.removeItem(KEY);
  token = "";
  state = null;
  connected = false;
  if(es){ es.close(); es = null; }
  if(retryTimer){ clearTimeout(retryTimer); retryTimer = null; }
  render();
}

async function api(path, opts={}){
  const headers = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
  if(token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  if(res.status === 401){
    clearAuth();
    throw new Error("Unauthorized");
  }
  const data = await res.json().catch(()=>({}));
  if(!res.ok){
    const err = data.error || `HTTP ${res.status}`;
    showError(err);
    throw new Error(err);
  }
  return data;
}

async function doPair(code, deviceName){
  if(pairing) return;
  draftCode = code;
  draftName = deviceName;
  pairing = true;
  pairError = "";
  render();
  try{
    const res = await fetch("/api/pair", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({token:code.trim(), device_name:deviceName.trim()||navigator.platform||"Mobile"})
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok || !data.device_token){
      pairError = data.error || "Invalid pairing code";
      return;
    }
    token = data.device_token;
    localStorage.setItem(KEY, token);
    draftCode = "";
    if(urlPair){ history.replaceState({}, "", "/"); }
    startLive();
  }catch(_){
    pairError = "Connection failed";
  }finally{
    pairing = false;
    render();
  }
}

async function startLive(){
  try{
    state = await api("/api/state");
    connected = true;
    retryMs = 1000;
    ensureSelection();
    render();
    connectSse();
  }catch(_){
    connected = false;
    renderHeaderOnly();
    if(token) scheduleReconnect();
  }
}

function scheduleReconnect(){
  if(retryTimer || !token) return;
  retryTimer = setTimeout(async ()=>{
    retryTimer = null;
    if(!token) return;
    await startLive();
  }, retryMs);
  retryMs = Math.min(retryMs * 2, 8000);
}

function connectSse(){
  if(es){ es.close(); es = null; }
  if(!token) return;
  es = new EventSource("/api/events?token=" + encodeURIComponent(token));
  es.onopen = ()=>{ connected = true; retryMs = 1000; renderHeaderOnly(); };
  es.onerror = ()=>{
    connected = false;
    renderHeaderOnly();
    if(es && es.readyState === EventSource.CLOSED){
      es.close();
      es = null;
      scheduleReconnect();
    }
  };
  es.onmessage = (ev)=>{
    try{
      state = JSON.parse(ev.data);
      connected = true;
      retryMs = 1000;
      ensureSelection();
      render();
    }catch(_){}
  };
}

function ensureSelection(){
  if(!state || !state.panes || !state.panes.length) return;
  if(!selectedPane || !state.panes.some(p=>p.id===selectedPane)){
    const urgent = state.panes.find(p=>p.rate_limit || p.status==="needs_input") || state.panes[0];
    selectedPane = urgent ? urgent.id : null;
  }
}

async function sendAction(paneId, action){
  try{ await api(`/api/pane/${paneId}/input`, {method:"POST", body:JSON.stringify({action})}); }catch(_){}
}

async function sendPrompt(paneId){
  const el = document.getElementById("prompt-input");
  if(!el || !el.value.trim()) return;
  const text = el.value;
  try{
    await api(`/api/pane/${paneId}/input`, {method:"POST", body:JSON.stringify({text, enter:true})});
    const cur = document.getElementById("prompt-input");
    if(cur && cur.value === text) cur.value = "";
  }catch(_){}
}

async function switchProfile(paneId, profileId){
  try{ await api(`/api/pane/${paneId}/switch-profile`, {method:"POST", body:JSON.stringify({profile_id:profileId})}); }catch(_){}
}

async function resumeSession(projectId, agent, sessionId, profileId){
  try{
    await api("/api/session/resume", {
      method:"POST",
      body:JSON.stringify({project_id:Number(projectId), agent, session_id:sessionId, profile_id:profileId || null})
    });
    tab = "live";
    render();
  }catch(_){}
}

function renderHeaderOnly(){
  const dot = document.getElementById("conn-dot");
  if(dot) dot.className = "dot " + (connected ? "ok" : "warn");
}

function renderPair(){
  root.innerHTML = `<div class="solo"><div class="pair">
    ${LOGO}
    <h1>Pair with TernaryCode</h1>
    <p class="lead">Scan the code in Settings → Phone on your computer, or paste it here.</p>
    <label class="field${pairError?" err":""}"><input id="p-code" class="mono" value="${esc(draftCode)}" placeholder="Pairing code" aria-label="Pairing code" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false"></label>
    <label class="field">${ic("phone")}<input id="p-name" value="${esc(draftName)}" placeholder="Device name" aria-label="Device name"></label>
    ${pairError?`<div class="err-text" role="alert">${glyph("failed", 14)}${esc(pairError)}</div>`:""}
    <button class="btn primary block" data-act="pair">Connect</button>
    <p class="note">Each phone gets its own key. You can revoke it from TernaryCode at any time.</p>
  </div></div>`;
}

function healthyProfilesFor(pane){
  return (state.profiles||[])
    .filter(p=>p.enabled && p.signed_in !== false && p.state!=="rate_limited" && p.state!=="cooldown" && p.state!=="error" && p.id!==pane.profile)
    .sort((a,b)=>{
      const am = pane.provider && a.provider === pane.provider ? 0 : 1;
      const bm = pane.provider && b.provider === pane.provider ? 0 : 1;
      return am - bm;
    });
}

function renderChipsHtml(panes, activeId){
  return panes.map(p=>{
    const cls = p.id===activeId ? "chip active" : "chip";
    return `<button class="${cls}" data-act="select-pane" data-pane="${p.id}">${glyph(p.rate_limit?"rate_limited":p.status, 12)}<span>${esc(p.project_name)}</span><span class="lbl">${esc(p.label)}</span></button>`;
  }).join("");
}

function renderLive(){
  const panes = state.panes || [];
  if(!panes.length) return emptyState("term", "No panes open", `Terminals and agents open on your ${esc(hostName())} show up here.`);
  const pane = panes.find(p=>p.id===selectedPane) || panes[0];
  const healthy = healthyProfilesFor(pane);
  let html = `<div class="chips" id="pane-chips">${renderChipsHtml(panes, pane.id)}</div>`;

  const where = `${pane.profile||(pane.supports_profiles?"default":pane.label)}${pane.branch?` · ${pane.branch}`:""}`;
  html += `<div class="sheet">
    <div class="pane-head">${pill(pane.rate_limit?"rate_limited":pane.status, pane.rate_limit?"Rate limited":pane.status_label)}<span class="where">${esc(where)}</span></div>
    <div class="term" id="term-box">${esc(pane.output || "(no output yet)")}</div>
  </div>`;

  if(pane.rate_limit){
    const rlSecs = secsUntil(pane.rate_limit.resets_at_unix);
    html += notice("rate_limited", `${esc(pane.rate_limit.from_profile)} hit its limit${rlSecs?` · resets in ${esc(fmtReset(rlSecs))}`:""}`, pane.rate_limit.reason);
    html += healthy.length
      ? `<div class="btns">` + healthy.map((pr,i)=>`<button class="btn ${i?"raised":"primary"}" data-act="switch" data-pane="${pane.id}" data-profile="${esc(pr.id)}">Resume on ${esc(pr.id)}</button>`).join("") + `</div>`
      : `<div class="muted">No other account is free to take over.</div>`;
  } else if(pane.status === "needs_input"){
    html += notice("needs_input", `${esc(pane.label)} needs your input`, pane.message || "Waiting for your confirmation");
    html += `<div class="trio">
      <button class="btn primary" data-act="quick" data-pane="${pane.id}" data-kind="approve">Approve</button>
      <button class="btn raised" data-act="quick" data-pane="${pane.id}" data-kind="reject">Reject</button>
      <button class="btn danger" data-act="quick" data-pane="${pane.id}" data-kind="interrupt">Stop</button>
    </div>`;
  }

  html += `<div class="composer">
    <label class="field"><input id="prompt-input" data-pane="${pane.id}" placeholder="Send an instruction to ${esc(pane.label)}…" aria-label="Instruction" enterkeyhint="send"></label>
    <button class="btn secondary sm" data-act="send-prompt" data-pane="${pane.id}">Send</button>
  </div>`;

  if(pane.supports_profiles && healthy.length && !pane.rate_limit){
    html += `<div class="sect"><div class="label">Switch account</div><div class="swaps">` +
      healthy.slice(0,4).map(pr=>{
        const u5 = pr.window_5h && pr.window_5h.used_pct != null ? `${Math.round(pr.window_5h.used_pct)}%` : "";
        return `<button class="swap" data-act="switch" data-pane="${pane.id}" data-profile="${esc(pr.id)}">${ic("swap", "g12")}${esc(pr.id)}${u5?`<span class="pct">${u5}</span>`:""}</button>`;
      }).join("")
      + `</div></div>`;
  }
  return html;
}

function renderProjects(){
  const projects = state.projects || [];
  if(!projects.length) return emptyState("folder", "No projects open", `Projects open on your ${esc(hostName())} show up here.`);
  return projects.map(pr=>{
    const sessions = pr.sessions || [];
    return `<section class="group">
      <div class="group-head"><span class="name">${esc(pr.name)}</span>${pr.branch?`<span class="branch">${ic("branch", "g12")}<span>${esc(pr.branch)}</span></span>`:""}</div>
      <div class="card">` + (sessions.length ? sessions.map(s=>`
        <div class="row click" data-act="${s.live_pane?"focus-live":"resume-session"}" data-pane="${s.live_pane||""}" data-project="${pr.id}" data-agent="${esc(s.agent)}" data-session="${esc(s.id)}" data-profile="${esc(s.profile||"")}">
          ${glyph(s.status, 14)}
          <div class="grow">
            <div class="t1">${esc(s.title)}</div>
            <div class="data">${esc(s.profile||s.agent)} · ${esc(s.age)}</div>
          </div>
          ${s.live_pane?`<span class="tag t-accent">Live</span>`:`<span class="go">${ic("resume", "g12")}Resume</span>`}
        </div>`).join("") : `<div class="row"><span class="muted">No sessions yet</span></div>`) + `</div>
    </section>`;
  }).join("");
}

function secsUntil(unixTs){
  if(!unixTs) return 0;
  return Math.max(0, Math.round(unixTs - Date.now() / 1000));
}

function fmtReset(s){
  if(!s) return "";
  if(s >= 86400) return `${Math.floor(s/86400)}d ${Math.floor((s%86400)/3600)}h`;
  return fmtSec(s);
}

function renderWinBar(w){
  if(!w) return "";
  const pct = w.used_pct != null ? Math.round(w.used_pct) : null;
  const tone = pct==null ? "idle" : pct>=90 ? "limited" : pct>=70 ? "input" : "accent";
  const val = pct!=null ? `${pct}%${w.tokens?` · ${fmtTok(w.tokens)}`:""}` : `${fmtTok(w.tokens||0)} tok`;
  const rem = secsUntil(w.resets_at_unix);
  return `<div class="meter">
    <div class="meter-top">
      <span class="meter-lbl">${esc(w.label)}</span>
      <span class="meter-val${pct!=null&&pct>=70?` c-${tone}`:""}">${esc(val)}</span>
      ${rem?`<span class="meter-rst">↺ ${esc(fmtReset(rem))}</span>`:""}
    </div>
    <div class="bar"><i class="b-${tone}" style="width:${pct!=null?Math.min(100,Math.max(0,pct)):0}%"></i></div>
  </div>`;
}

function renderProfiles(){
  const profiles = state.profiles || [];
  const mode = String(state.failover_mode||"auto");
  let html = `<div class="card"><div class="row">
    <div class="grow"><div class="t1">Failover</div><div class="t2">When an account hits its limit</div></div>
    <span class="val">${mode==="auto"?"Automatic":mode==="manual"?"Manual":esc(mode)}</span>
  </div></div>`;
  html += profiles.length ? profiles.map(p=>{
    const acc = own(ACCOUNT, p.enabled ? p.state : "disabled") || ["idle", String(p.state||"").replace("_"," ")];
    const hint = `${esc(p.provider)}${p.account_hint?` · ${esc(p.account_hint)}`:""}`;
    return `<div class="card acct${p.enabled?"":" dim"}">
      <div class="acct-top">
        <div class="grow">
          <div class="acct-line"><span class="acct-id">${esc(p.id)}</span>${p.plan_type?`<span class="tag t-accent">${esc(p.plan_type.toUpperCase())}</span>`:""}</div>
          <div class="t2">${hint}${p.signed_in === false?` · <span class="c-input">Not signed in</span>`:""}</div>
        </div>
        ${pill(acc[0], acc[1])}
      </div>
      ${renderWinBar(p.window_5h)}
      ${renderWinBar(p.window_weekly)}
      ${p.active_session?`<div class="data">Active in ${esc(p.active_session)}</div>`:""}
    </div>`;
  }).join("") : emptyState("user", "No accounts", `Add one in Settings → Accounts on your ${esc(hostName())}.`);
  html += `<button class="btn danger block" data-act="unpair">${ic("signout")}Unpair this device</button>`;
  return html;
}

// Log level → [status glyph, kind]. The log carries no project, so the message leads.
function alertKind(a){
  const m = String(a.message||"");
  if(a.level === "error") return ["failed", "Failed"];
  if(a.level === "failover") return ["rate_limited", "Switched account"];
  if(a.level === "warn") return /limit/i.test(m) ? ["rate_limited", "Rate limited"] : ["needs_input", "Needs input"];
  if(a.level === "tool") return ["running", "Tool"];
  return /finish|done|complete/i.test(m) ? ["done", "Finished"] : ["idle", "Info"];
}

function renderAlerts(){
  const alerts = state.alerts || [];
  if(!alerts.length) return emptyState("tray", "Nothing here yet", "Questions, rate limits, failures and finished turns show up here.");
  return `<div class="list">` + alerts.slice().reverse().map(a=>{
    const k = alertKind(a);
    return `<div class="item">${glyph(k[0], 14, false)}
      <div class="grow">
        <div class="t1 wrap">${esc(a.message)}</div>
        <div class="t2">${esc(k[1])}${a.profile?` · <span class="mono">${esc(a.profile)}</span>`:""}</div>
      </div>
      <span class="age">${esc(a.time)}</span>
    </div>`;
  }).join("") + `</div>`;
}

function tabButton(id, label, icon, count, tone){
  return `<button class="${tab===id?"active":""}" data-act="tab" data-tab="${id}"><span class="tab-ic">${ic(icon)}${count?`<span class="count t-${tone}">${count}</span>`:""}</span>${label}</button>`;
}

function renderNavHtml(urgentCount, alertLogCount, hasErr){
  return tabButton("live", "Live", "term", urgentCount, "input") +
    tabButton("alerts", "Inbox", "tray", alertLogCount, hasErr?"failed":"input") +
    tabButton("projects", "Projects", "squares", 0, "") +
    tabButton("profiles", "Accounts", "user", 0, "");
}

function render(){
  // Running glyphs spin in phase with the clock, so a re-render never restarts them.
  root.style.setProperty("--spin-delay", `-${Date.now() % 1200}ms`);
  if(pairing){
    root.innerHTML = `<div class="solo center">` + emptyState("phone", "Pairing…", "Exchanging pairing code with TernaryCode.") + `</div>`;
    return;
  }
  if(!token || (pairError && !state)){ renderPair(); return; }
  if(!state){
    root.innerHTML = `<div class="solo center">` + emptyState("offline", "Connecting to TernaryCode…", "Waiting for TernaryCode to answer.",
      `<div class="duo">
        <button class="btn secondary" data-act="retry">Retry</button>
        <button class="btn danger" data-act="unpair">Pair again</button>
      </div>`) + `</div>`;
    return;
  }

  const activeCount = (state.panes||[]).filter(p=>p.status==="running").length;
  const urgentCount = (state.panes||[]).filter(p=>p.rate_limit||p.status==="needs_input").length;
  const loud = (state.alerts||[]).filter(a=>a.level==="warn"||a.level==="error"||a.level==="failover");
  const alertLogCount = loud.length;
  const hasErr = loud.some(a=>a.level==="error");

  // While user is actively typing in `#prompt-input` on the same pane, patch live terminal output,
  // header counts, pane chips, and tab badges in place so virtual keyboard / IME composition is
  // never disrupted by DOM replacement.
  const prevInput = document.getElementById("prompt-input");
  const samePane = prevInput && Number(prevInput.dataset.pane) === selectedPane;
  const livePane = (state.panes||[]).find(p=>p.id===selectedPane);
  const healthyKey = livePane ? healthyProfilesFor(livePane).slice(0,4).map(p=>p.id).join(",") : "";
  const paneKey = livePane ? `${livePane.id}:${livePane.status}:${livePane.message||""}:${livePane.profile||""}:${livePane.rate_limit?livePane.rate_limit.reason:""}:${healthyKey}` : "";
  if(tab === "live" && samePane && !toastMsg && paneKey === lastRenderedPaneKey && document.activeElement === prevInput){
    const pane = livePane;
    const termBox = document.getElementById("term-box");
    if(pane && termBox){
      const nearBot = (termBox.scrollHeight - termBox.scrollTop - termBox.clientHeight) < 36;
      termBox.textContent = pane.output || "(no output yet)";
      if(nearBot) termBox.scrollTop = termBox.scrollHeight;
      const headConn = document.getElementById("head-conn");
      if(headConn) headConn.innerHTML = `<span id="conn-dot" class="dot ${connected?"ok":"warn"}"></span>${activeCount} active${urgentCount?` · ${urgentCount} waiting`:""}`;
      const chips = document.getElementById("pane-chips");
      if(chips) chips.innerHTML = renderChipsHtml(state.panes||[], pane.id);
      const nav = document.getElementById("tab-bar");
      if(nav) nav.innerHTML = renderNavHtml(urgentCount, alertLogCount, hasErr);
      return;
    }
  }
  const savedInput = samePane ? {
    val: prevInput.value,
    focused: document.activeElement === prevInput,
    start: prevInput.selectionStart,
    end: prevInput.selectionEnd
  } : null;
  const prevMain = root.querySelector("main");
  const savedMainScroll = (prevMain && lastRenderedTab === tab) ? prevMain.scrollTop : 0;
  const prevTerm = document.getElementById("term-box");
  const paneChanged = lastRenderedPane !== selectedPane;
  const termNearBottom = !prevTerm || paneChanged || (prevTerm.scrollHeight - prevTerm.scrollTop - prevTerm.clientHeight) < 36;
  const savedTermScroll = prevTerm ? prevTerm.scrollTop : 0;

  const title = tab==="live"?"Live":tab==="projects"?"Projects":tab==="profiles"?"Accounts":"Inbox";
  const body = (toastMsg?notice("failed", esc(toastMsg)):"") +
    (tab==="live"?renderLive():tab==="projects"?renderProjects():tab==="profiles"?renderProfiles():renderAlerts());

  root.innerHTML = `<div class="app">
    <main>
      <div class="head">
        <h1>${title}</h1>
        <span class="conn" id="head-conn"><span id="conn-dot" class="dot ${connected?"ok":"warn"}"></span>${activeCount} active${urgentCount?` · ${urgentCount} waiting`:""}</span>
      </div>
      ${body}
    </main>
    <nav id="tab-bar">
      ${renderNavHtml(urgentCount, alertLogCount, hasErr)}
    </nav>
  </div>`;

  lastRenderedPane = selectedPane;
  lastRenderedTab = tab;
  lastRenderedPaneKey = paneKey;
  const newMain = root.querySelector("main");
  if(newMain) newMain.scrollTop = savedMainScroll;
  const newTerm = document.getElementById("term-box");
  if(newTerm) newTerm.scrollTop = termNearBottom ? newTerm.scrollHeight : savedTermScroll;
  if(savedInput){
    const cur = document.getElementById("prompt-input");
    if(cur){
      cur.value = savedInput.val;
      if(savedInput.focused){
        cur.focus({preventScroll:true});
        try{ cur.setSelectionRange(savedInput.start, savedInput.end); }catch(_){}
      }
    }
  }
}

// Single delegated click & key handler (zero inline JS string interpolation / zero XSS).
root.addEventListener("click", (ev)=>{
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  if(act === "pair"){
    const code = document.getElementById("p-code")?.value || "";
    const name = document.getElementById("p-name")?.value || "";
    doPair(code, name);
  } else if(act === "tab"){
    tab = el.dataset.tab || "live";
    render();
  } else if(act === "select-pane"){
    selectedPane = Number(el.dataset.pane);
    render();
  } else if(act === "focus-live"){
    selectedPane = Number(el.dataset.pane);
    tab = "live";
    render();
  } else if(act === "switch"){
    switchProfile(Number(el.dataset.pane), el.dataset.profile);
  } else if(act === "quick"){
    sendAction(Number(el.dataset.pane), el.dataset.kind);
  } else if(act === "send-prompt"){
    sendPrompt(Number(el.dataset.pane));
  } else if(act === "resume-session"){
    resumeSession(el.dataset.project, el.dataset.agent, el.dataset.session, el.dataset.profile);
  } else if(act === "unpair"){
    clearAuth();
  } else if(act === "retry"){
    startLive();
  }
});

root.addEventListener("input", (ev)=>{
  if(ev.target && ev.target.id === "p-code") draftCode = ev.target.value;
  else if(ev.target && ev.target.id === "p-name") draftName = ev.target.value;
});

root.addEventListener("keydown", (ev)=>{
  if(ev.key !== "Enter" || ev.isComposing) return;
  if(ev.target && ev.target.id === "prompt-input"){
    sendPrompt(Number(ev.target.dataset.pane));
  } else if(ev.target && (ev.target.id === "p-code" || ev.target.id === "p-name")){
    const code = document.getElementById("p-code")?.value || "";
    const name = document.getElementById("p-name")?.value || "";
    doPair(code, name);
  }
});

if(urlPair){
  // Explicit QR pairing link always takes precedence over any stale saved token.
  doPair(urlPair, draftName);
}else if(token){
  render();
  startLive();
}else{
  render();
}
</script>
</body>
</html>
