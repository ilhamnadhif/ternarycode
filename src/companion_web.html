function renderConfirmModalHtml() {
  if (!confirmClosePane) return "";
  return `<div class="confirm-modal" data-act="cancel-close">
    <div class="confirm-card">
      <div style="font-size:16px;font-weight:600">Close ${esc(confirmClosePane.label)}?</div>
      <div style="font-size:13px;color:var(--text-2)">This stops the active session in ${esc(confirmClosePane.project_name)}.</div>
      <div class="btn-row" style="margin-top:4px">
        <button class="btn raised" data-act="cancel-close">Cancel</button>
        <button class="btn danger" data-act="confirm-close">Close</button>
      </div>
    </div>
  </div>`;
}

// ── Live Terminal Patching (ZERO scroll reset / ZERO input blur!) ──
function patchTerminalContent(forceBottom) {
  const pane = currentPane();
  if (!pane) return;
  const raw = pane.output || "(no output yet)";
  const changedPane = lastTermPaneId !== pane.id;
  const needsHtml = changedPane || lastTermRaw !== raw || lastTermWrap !== prefs.wrap || lastTermTheme !== prefs.theme || lastTermFont !== prefs.fontSize;
  const html = needsHtml ? renderTerminalHtml(raw, prefs.wrap) : null;

  for (const [scrollId, bodyId] of [["term-scroll", "term-body"], ["fs-term-scroll", "fs-term-body"]]) {
    const sc = document.getElementById(scrollId);
    const bd = document.getElementById(bodyId);
    if (!sc || !bd) continue;
    if (!sc.__tcBound) {
      sc.__tcBound = true;
      sc.addEventListener("scroll", () => {
        const dist = sc.scrollHeight - sc.scrollTop - sc.clientHeight;
        const nextUp = dist > 72;
        if (nextUp !== termScrolledUp) {
          termScrolledUp = nextUp;
          const lp = document.getElementById("latest-pill");
          if (lp) lp.classList.toggle("hidden", !termScrolledUp);
        }
      }, { passive: true });
    }
    const prevTop = sc.scrollTop;
    if (html !== null || !bd.innerHTML) {
      bd.innerHTML = html !== null ? html : renderTerminalHtml(raw, prefs.wrap);
    }
    if (forceBottom || changedPane || !termScrolledUp) {
      sc.scrollTop = sc.scrollHeight;
      termScrolledUp = false;
      const lp = document.getElementById("latest-pill");
      if (lp) lp.classList.add("hidden");
    } else {
      sc.scrollTop = prevTop;
    }
  }
  const wk = document.getElementById("term-working");
  if (wk) {
    wk.style.display = pane.status === "running" && !pane.rate_limit ? "flex" : "none";
    const wkt = document.getElementById("term-working-txt");
    if (wkt) wkt.textContent = pane.message || (pane.label + " is working…");
  }
  lastTermPaneId = pane.id;
  lastTermRaw = raw;
  lastTermWrap = prefs.wrap;
  lastTermTheme = prefs.theme;
  lastTermFont = prefs.fontSize;
}

function patchHeaderDots() {
  const cls = "dot " + (connected ? "ok" : (reconnecting ? "warn" : "err"));
  document.querySelectorAll("[data-conn-dot]").forEach((el) => { el.className = cls; });
}

let lastLiveStructKey = "";
function liveStructKey() {
  const pane = currentPane();
  if (!pane) return "empty";
  const pr = pane.rate_limit ? null : parseInteractivePrompt(pane.output || "");
  const healthy = healthyProfilesFor(pane).slice(0, 4).map((p) => p.id).join(",");
  return `${pane.id}|${pane.status}|${pane.status_label}|${pane.profile || ""}|${pane.branch || ""}|${pane.rate_limit ? pane.rate_limit.reason : ""}|${pr ? pr.title + pr.selectedIndex : ""}|${healthy}|${(state.panes || []).length}|${reconnecting}|${showQuickKeys}|${fullscreenOpen}|${settingsOpen}|${Boolean(spawnSheet)}`;
}

// Smart update on incoming WS/SSE snapshot: patches terminal in place when on Live so scroll & typing NEVER jank!
function updateUI() {
  if (tab === "live" && !settingsOpen && !spawnSheet && !confirmClosePane && document.getElementById("term-scroll")) {
    const key = liveStructKey();
    if (key === lastLiveStructKey) {
      patchTerminalContent(false);
      patchHeaderDots();
      return;
    }
  }
  render();
}

function render() {
  root.style.setProperty("--spin-delay", `-${Date.now() % 1000}ms`);

  if (pairing) {
    root.innerHTML = `<div class="solo center"><div class="empty"><div class="empty-tile">${statusGlyph("running", "s20", true)}</div><div class="empty-title">Pairing with TernaryCode…</div><div class="empty-body">Exchanging one-time pairing code securely.</div></div></div>`;
    return;
  }
  if (!token || (pairError && !state)) {
    root.innerHTML = `<div class="solo"><div class="pair-box">
      ${APP_LOGO}
      <h1 class="top-title" style="margin-top:4px">Pair with TernaryCode</h1>
      <p style="margin:0;color:var(--text-2);font-size:13px">${revoked ? "This browser was revoked on your computer. Enter the new pairing code from Settings → Phone." : "Scan the QR code in Settings → Phone on your computer, or paste the pairing code below."}</p>
      <input class="pair-in mono" id="p-code" value="${esc(draftCode)}" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <input class="pair-in" id="p-name" value="${esc(draftName)}" placeholder="Device name">
      ${pairError ? `<div class="c-failed" style="font-size:12px">${esc(pairError)}</div>` : ""}
      <button class="btn primary block" data-act="pair">Connect</button>
      <p style="margin:0;font-size:12px;color:var(--text-3)">${IS_RELAY ? "Connecting via Cloudflare Relay — works on Wi-Fi and 4G/5G." : "Connecting on local Wi-Fi. Enable Remote access in Settings → Phone to connect from anywhere."}</p>
    </div></div>`;
    return;
  }
  if (!state) {
    root.innerHTML = `<div class="solo center"><div class="empty">
      <div class="empty-tile">${ic("offline", "s22")}</div>
      <div class="empty-title">Connecting to TernaryCode…</div>
      <div class="empty-body">Waiting for your computer to answer${IS_RELAY ? " via Cloudflare Relay" : ""}.</div>
      <div class="btn-row" style="width:100%;max-width:280px;margin-top:6px">
        <button class="btn secondary" data-act="retry">Retry</button>
        <button class="btn danger" data-act="unpair">Pair again</button>
      </div>
    </div></div>`;
    return;
  }

  // Preserve active input state & scroll positions across structural re-renders.
  const prevPrompt = document.getElementById("prompt-input");
  const savedPrompt = prevPrompt ? { val: prevPrompt.value, focus: document.activeElement === prevPrompt, s: prevPrompt.selectionStart, e: prevPrompt.selectionEnd } : null;
  const prevSearch = document.getElementById("proj-search");
  const savedSearchFocus = prevSearch && document.activeElement === prevSearch;
  const prevScroll = root.querySelector(".scroll-body");
  const savedScrollTop = prevScroll ? prevScroll.scrollTop : 0;
  const prevTerm = document.getElementById("term-scroll");
  const savedTermTop = prevTerm ? prevTerm.scrollTop : null;

  const panes = state.panes || [];
  const urgentCount = panes.filter(isUrgentPane).length;
  const screenHtml = tab === "live" ? renderLiveScreen() : tab === "inbox" ? renderInboxScreen() : tab === "projects" ? renderProjectsScreen() : renderAccountsScreen();

  root.innerHTML = `<div class="shell">
    ${screenHtml}
    <nav class="bnav">
      <button class="${tab === "live" ? "on" : ""}" data-act="tab" data-tab="live"><span class="nav-ic">${ic("term", "s20")}</span>Live</button>
      <button class="${tab === "inbox" ? "on" : ""}" data-act="tab" data-tab="inbox"><span class="nav-ic">${ic("tray", "s20")}${urgentCount ? `<span class="nav-badge t-input">${urgentCount}</span>` : ""}</span>Inbox</button>
      <button class="${tab === "projects" ? "on" : ""}" data-act="tab" data-tab="projects"><span class="nav-ic">${ic("squares", "s20")}</span>Projects</button>
      <button class="${tab === "accounts" ? "on" : ""}" data-act="tab" data-tab="accounts"><span class="nav-ic">${ic("user", "s20")}</span>Accounts</button>
    </nav>
    ${renderSpawnSheetHtml()}
    ${renderSettingsSheetHtml()}
    ${renderFullscreenHtml()}
    ${renderConfirmModalHtml()}
    <div class="toast" id="tc-toast" style="display:${toastMsg ? "block" : "none"}">${esc(toastMsg)}</div>
  </div>`;

  if (tab === "live" || fullscreenOpen) {
    lastLiveStructKey = liveStructKey();
    patchTerminalContent(false);
    if (savedTermTop !== null && termScrolledUp) {
      const sc = document.getElementById("term-scroll");
      if (sc) sc.scrollTop = savedTermTop;
    }
  }
  const newScroll = root.querySelector(".scroll-body");
  if (newScroll && savedScrollTop) newScroll.scrollTop = savedScrollTop;

  if (savedPrompt) {
    const el = document.getElementById("prompt-input");
    if (el) {
      el.value = savedPrompt.val;
      if (savedPrompt.focus) { el.focus({ preventScroll: true }); try { el.setSelectionRange(savedPrompt.s, savedPrompt.e); } catch {} }
    }
  }
  if (savedSearchFocus) {
    const el = document.getElementById("proj-search");
    if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(el.value.length, el.value.length); } catch {} }
  }
}

// ── Single Delegated Event Listeners (Zero XSS / Zero inline handlers) ──
root.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "pair") {
    doPair(document.getElementById("p-code")?.value || "", document.getElementById("p-name")?.value || "");
  } else if (act === "tab") {
    tab = el.dataset.tab || "live";
    render();
  } else if (act === "focus-pane") {
    selectedPaneId = Number(el.dataset.pane);
    termScrolledUp = false;
    tab = "live";
    render();
  } else if (act === "toggle-wrap") {
    prefs.wrap = !prefs.wrap;
    savePrefs();
    render();
  } else if (act === "toggle-theme") {
    prefs.theme = prefs.theme === "dark" ? "light" : "dark";
    savePrefs();
    render();
  } else if (act === "font-inc") {
    prefs.fontSize = Math.min(15, +(prefs.fontSize + 0.5).toFixed(1));
    savePrefs();
    render();
  } else if (act === "font-dec") {
    prefs.fontSize = Math.max(9.5, +(prefs.fontSize - 0.5).toFixed(1));
    savePrefs();
    render();
  } else if (act === "copy-output") {
    const p = ((state && state.panes) || []).find((x) => x.id === Number(el.dataset.pane)) || currentPane();
    if (p) copyText(p.output || "", "Copied output");
  } else if (act === "open-fs") {
    fullscreenOpen = true;
    render();
  } else if (act === "close-fs") {
    fullscreenOpen = false;
    render();
  } else if (act === "toggle-keys") {
    showQuickKeys = !showQuickKeys;
    render();
  } else if (act === "scroll-latest") {
    termScrolledUp = false;
    const sc = document.getElementById("term-scroll");
    if (sc) sc.scrollTo({ top: sc.scrollHeight, behavior: "smooth" });
    const lp = document.getElementById("latest-pill");
    if (lp) lp.classList.add("hidden");
  } else if (act === "send-prompt") {
    sendComposer(Number(el.dataset.pane), "prompt-input");
  } else if (act === "send-fs-prompt") {
    sendComposer(Number(el.dataset.pane), "fs-prompt-input");
  } else if (act === "quick") {
    ev.stopPropagation();
    const k = el.dataset.kind;
    sendAction(Number(el.dataset.pane), k, k === "approve" ? "Approved" : k === "reject" ? "Rejected" : "Sent Stop (^C)");
  } else if (act === "dismiss-limit") {
    ev.stopPropagation();
    sendAction(Number(el.dataset.pane), "dismiss_limit", "Dismissed rate limit");
  } else if (act === "switch-prof") {
    ev.stopPropagation();
    switchProfile(Number(el.dataset.pane), el.dataset.profile);
  } else if (act === "rerun") {
    const p = ((state && state.panes) || []).find((x) => x.id === Number(el.dataset.pane));
    if (p) sendInput(p.id, p.label, true, `Re-running ${p.label}`);
  } else if (act === "send-esc") {
    sendInput(Number(el.dataset.pane), "\x1B", false, "Sent Esc");
  } else if (act === "ip-opt") {
    if (window.__activePrompt) selectPromptOption(Number(el.dataset.pane), window.__activePrompt, Number(el.dataset.idx));
  } else if (act === "qkey") {
    const id = Number(el.dataset.pane), k = el.dataset.key;
    if (k === "enter") sendInput(id, "", true, "Sent Enter");
    else if (k === "esc") sendInput(id, "\x1B", false, "Sent Esc");
    else if (k === "tab") sendInput(id, "\t", false, "Sent Tab");
    else if (k === "up") sendInput(id, "\x1B[A", false, "Sent Up");
    else if (k === "down") sendInput(id, "\x1B[B", false, "Sent Down");
  } else if (act === "close-pane") {
    ev.stopPropagation();
    const p = ((state && state.panes) || []).find((x) => x.id === Number(el.dataset.pane));
    if (!p) return;
    if (p.status === "running" || p.status === "needs_input") { confirmClosePane = p; render(); }
    else closePane(p);
  } else if (act === "confirm-close") {
    const p = confirmClosePane;
    confirmClosePane = null;
    render();
    if (p) closePane(p);
  } else if (act === "cancel-close" && (ev.target === el || el.tagName === "BUTTON")) {
    confirmClosePane = null;
    render();
  } else if (act === "open-spawn") {
    openSpawnSheet(el.dataset.project, el.dataset.worktree);
  } else if (act === "close-spawn" || (act === "close-spawn-bg" && ev.target === el)) {
    spawnSheet = null;
    render();
  } else if (act === "spawn-wt" && spawnSheet) {
    spawnSheet.worktreeId = el.dataset.wt ? Number(el.dataset.wt) : null;
    render();
  } else if (act === "spawn-agent" && spawnSheet) {
    spawnSheet.agent = el.dataset.slug;
    spawnSheet.profileId = null;
    render();
  } else if (act === "spawn-prof" && spawnSheet) {
    spawnSheet.profileId = el.dataset.prof || null;
    render();
  } else if (act === "spawn-start") {
    startNewAgent();
  } else if (act === "spawn-resume") {
    resumeSessionFromSheet(el.dataset.project, el.dataset.agent, el.dataset.session, spawnSheet ? spawnSheet.profileId : null, el.dataset.live);
  } else if (act === "open-settings") {
    settingsOpen = true;
    render();
  } else if (act === "close-settings" || (act === "close-settings-bg" && ev.target === el)) {
    settingsOpen = false;
    render();
  } else if (act === "inbox-filter") {
    inboxFilter = el.dataset.val || "all";
    render();
  } else if (act === "open-alert-proj") {
    const proj = el.dataset.proj || "";
    const match = ((state && state.panes) || []).find((p) => p.project_name.toLowerCase() === proj.toLowerCase());
    if (match) { selectedPaneId = match.id; tab = "live"; }
    else { projectQuery = proj; tab = "projects"; }
    render();
  } else if (act === "clear-search") {
    projectQuery = "";
    render();
  } else if (act === "toggle-active-grp") {
    activeCollapsed = !activeCollapsed;
    render();
  } else if (act === "toggle-idle-grp") {
    idleCollapsed = !idleCollapsed;
    render();
  } else if (act === "unpair") {
    settingsOpen = false;
    clearAuth(false);
  } else if (act === "retry") {
    retryMs = 1000;
    startLive();
  }
});

root.addEventListener("input", (ev) => {
  const t = ev.target;
  if (!t) return;
  if (t.id === "p-code") draftCode = t.value;
  else if (t.id === "p-name") draftName = t.value;
  else if (t.id === "proj-search") { projectQuery = t.value; render(); }
});

root.addEventListener("keydown", (ev) => {
  if (ev.key !== "Enter" || ev.isComposing) return;
  const t = ev.target;
  if (!t) return;
  if (t.id === "prompt-input") sendComposer(Number(t.dataset.pane), "prompt-input");
  else if (t.id === "fs-prompt-input") sendComposer(Number(t.dataset.pane), "fs-prompt-input");
  else if (t.id === "p-code" || t.id === "p-name") doPair(document.getElementById("p-code")?.value || "", document.getElementById("p-name")?.value || "");
});

if (urlPair) {
  doPair(urlPair, draftName);
} else if (token) {
  render();
  startLive();
} else {
  render();
}
</script>
</body>
</html>
