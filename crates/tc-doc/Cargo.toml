[package]
name = "tc-doc"
version = "0.1.0"
edition = "2024"
description = "TernaryCode document viewers: PDF pages, Word and PowerPoint text, spreadsheets, CSV and images, read into plain data the app draws"
license = "MIT"
publish = false

[dependencies]
calamine = "0.38.0"
csv = "1.4.0"
hayro = "0.9.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
quick-xml = "0.41.0"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
