[package]
name = "tc-web"
version = "0.1.0"
edition = "2024"
description = "TernaryCode's page helper on Linux: WebKitGTK pages laid in the app's X11 window, driven over its stdin and stdout"
license = "MIT"
publish = false

# Its own program, so that the app itself needs no GTK or WebKit (it starts on any distribution,
# and pages show where WebKitGTK is there).
[[bin]]
name = "ternarycode-web"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
serde_json = "1.0.154"
wry = { version = "0.57.2", default-features = false, features = ["devtools", "os-webview", "x11"] }
gtk = "0.18"
gdk = "0.18"
gdkx11 = "0.18"
glib = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
x11-dl = "2.21"
raw-window-handle = "0.6.2"
